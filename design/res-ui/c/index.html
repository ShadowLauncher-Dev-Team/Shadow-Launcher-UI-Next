<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shadow 资源库 · 控制台式</title>
<style>
:root{
  --bg:#08090d; --sidebar:#0a0b0f; --line:#14171d; --line2:#262b35;
  --fg:#e8ebf2; --fg2:#98a1ae; --fg3:#5d6673;
  --accent:#3b82f6; --accent-top:#4b8cf7; --accent-bot:#2563eb;
  --ok:#4ade80; --warn:#f59e0b; --danger:#ef4444;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#08090d;color:#e8ebf2;
  font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:13px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;outline:none}
input{font-family:inherit}
::selection{background:rgba(59,130,246,.35)}
svg{display:block}
.ico{width:16px;height:16px;flex:none}
.ico.s11{width:11px;height:11px}.ico.s12{width:12px;height:12px}.ico.s13{width:13px;height:13px}
.ico.s14{width:14px;height:14px}.ico.s15{width:15px;height:15px}.ico.s18{width:18px;height:18px}
.ico.s20{width:20px;height:20px}.ico.s22{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1a202a;border:3px solid transparent;background-clip:padding-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#29323f;background-clip:padding-box}

.app{display:flex;height:100vh;width:100vw;overflow:hidden;
  background:radial-gradient(1100px 520px at 58% -18%, rgba(59,130,246,.09), transparent 62%),#08090d}

/* rail */
.rail{width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:6px;
  border-right:1px solid var(--line);background:linear-gradient(180deg,#0b0d12,#090a0e);z-index:6}
.brand{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px;
  background:linear-gradient(160deg,#16233a,#0d1420);border:1px solid #243148;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px -10px rgba(59,130,246,.9)}
.nav{position:relative;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:#5d6673;transition:.12s}
.nav:hover{color:#aab3c0;background:#11151c}
.nav.on{color:#eaf0fb;background:linear-gradient(180deg,#151d29,#111720)}
.nav.on::before{content:"";position:absolute;left:-12px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 10px rgba(59,130,246,.65)}
.nav[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:48px;top:50%;transform:translateY(-50%);
  background:#141a23;border:1px solid #242e3c;color:#dbe2ec;font-size:11px;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:30}
.rail .sp{flex:1}
.rail-ver{font-size:10px;color:#3f4854;letter-spacing:.04em}

/* workbench */
.wb{flex:1;min-width:0;display:flex;height:100%}
.tree{width:200px;flex:0 0 200px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#0a0b0f}
.tree-head{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px;
  border-bottom:1px solid rgba(255,255,255,.04)}
.tree-head .t{font-size:12.5px;font-weight:600;color:#e8ebf2;display:flex;align-items:center;gap:7px}
.tree-head .t svg{color:#5d6673}
.tree-scroll{flex:1;min-height:0;overflow-y:auto;padding:8px 8px 18px}
.tg{margin-bottom:10px}
.tg-t{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 6px;
  font-size:10px;letter-spacing:.08em;color:#5d6673;font-weight:600}
.tg-t em{font-style:normal;font-weight:400;color:#3f4854;letter-spacing:0}
.ti{position:relative;display:flex;align-items:center;gap:8px;height:30px;padding:0 9px;border-radius:5px;
  color:#98a1ae;font-size:12.5px;cursor:pointer;transition:background .12s,color .12s}
.ti:hover{background:#101419;color:#e8ebf2}
.ti .n{margin-left:auto;font-size:10.5px;color:#4d5764;font-variant-numeric:tabular-nums}
.ti.on{background:#11151c;color:#fff}
.ti.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px rgba(59,130,246,.5)}
.ti.on .n{color:#7fa9e8}
.ti svg{color:#6f7987}
.ti.on svg{color:#8fb6f8}
.sub{display:flex;flex-direction:column;gap:1px;margin-top:2px}
.si{display:flex;align-items:center;gap:7px;height:27px;padding:0 9px 0 27px;border-radius:5px;
  font-size:11.5px;color:#7d8794;cursor:pointer;transition:.12s}
.si:hover{background:#101419;color:#c3ccd9}
.si.on{color:#bcd7ff;background:rgba(59,130,246,.09)}
.si .k{margin-left:auto;font-size:10px;color:#4d5764;font-variant-numeric:tabular-nums}
.si.on .k{color:#7fa9e8}
.tree-foot{flex:0 0 auto;padding:10px 12px 12px;border-top:1px solid rgba(255,255,255,.05);font-size:10px;color:#4d5764;line-height:1.6}
.tree-foot b{color:#98a1ae;font-weight:500}
.tree-foot .dots{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:5px}
.tree-foot .dots i{width:5px;height:5px;border-radius:3px;background:#4ade80}
.tree-foot .dots i.cf{background:#f97316}
.tree-foot .dots i.off{background:#2a323d}

/* main list */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.ltop{flex:0 0 auto;height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #12161d}
.search{flex:1;min-width:140px;height:34px;display:flex;align-items:center;gap:9px;padding:0 11px;border-radius:8px;
  border:1px solid #1b202a;background:linear-gradient(180deg,#0e1219,#0b0e14);transition:.14s}
.search:focus-within{border-color:rgba(59,130,246,.55);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:#e8ebf2;font-size:12.5px;height:100%}
.search input::placeholder{color:#4f5965}
.search svg{color:#5d6673}
.kbd{font-size:10px;color:#7d8794;border:1px solid #262d39;border-bottom-width:2px;border-radius:4px;padding:2px 4px;background:#12161d}
.cnt{font-size:11.5px;color:#6d7683;white-space:nowrap}
.cnt b{color:#dbe2ec;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:2px;padding:3px;border:1px solid #171c24;background:#0b0e13;border-radius:8px}
.seg button{height:26px;padding:0 9px;border-radius:5px;font-size:11px;color:#98a1ae;white-space:nowrap;transition:.12s}
.seg button:hover{color:#e8ebf2;background:#12161d}
.seg button.on{background:#1a2230;color:#fff}

.tbl-head{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) 92px 84px 84px 104px;gap:12px;
  align-items:center;height:32px;padding:0 18px;font-size:10px;letter-spacing:.06em;color:#5d6673;
  border-bottom:1px solid #14171d;background:#080a0e;font-weight:600}
.tbl-head span:not(:first-child){text-align:right}
.tbl-scroll{flex:1;min-height:0;overflow-y:auto;position:relative}
.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 84px 84px 104px;gap:12px;align-items:center;
  height:56px;padding:0 18px;border-bottom:1px solid #0f1319;cursor:pointer;position:relative;transition:background .1s}
.row:hover{background:#0d1116}
.row.on{background:#11151c}
.row.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.row.on::after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,transparent,rgba(59,130,246,.55),transparent)}
.row .cell{display:flex;align-items:center;gap:10px;min-width:0}
.row .art{width:32px;height:32px;flex:0 0 32px;border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.row .art svg{width:100%;height:100%}
.row .nm{min-width:0}
.row .cn{font-size:12.5px;color:#e8ebf2;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .en{font-size:10px;color:#5d6673;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .src{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:10.5px;color:#7d8794;white-space:nowrap}
.row .src i{width:5px;height:5px;border-radius:3px;background:#4ade80}
.row .src.cf i{background:#f97316}
.row .r{justify-content:flex-end;font-size:11.5px;color:#98a1ae;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .r b{color:#dbe2ec;font-weight:500}
.row .r.dim{color:#6d7683}
.row .dl-mini{position:absolute;right:14px;top:50%;transform:translateY(-50%) translateX(4px);width:26px;height:26px;
  border-radius:6px;display:grid;place-items:center;border:1px solid #2a3646;background:#131a24;color:#bcd0e8;
  opacity:0;transition:.12s}
.row:hover .dl-mini{opacity:1;transform:translateY(-50%)}
.row .dl-mini:hover{background:rgba(59,130,246,.16);border-color:rgba(59,130,246,.55);color:#cfe2ff}
.row:hover .r:last-child{padding-right:26px}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:20px}
.empty .ei{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px;
  border:1px solid #1e242e;background:#0d1117;color:#4d5764}
.empty h4{margin:0;font-size:13px;color:#b6bfcc;font-weight:600}
.empty p{margin:5px 0 14px;font-size:11.5px;color:#6d7683;max-width:320px}
.empty .acts{display:flex;gap:8px;justify-content:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:7px;
  border:1px solid #232b38;background:linear-gradient(180deg,#121820,#0d1219);color:#c6cfdb;font-size:12px;transition:.13s;white-space:nowrap}
.btn:hover{border-color:#334257;color:#fff;background:linear-gradient(180deg,#17202b,#0f151d)}
.btn.sm{height:28px;padding:0 10px;font-size:11.5px;border-radius:6px}
.btn.primary{border-color:rgba(59,130,246,.65);color:#fff;background:linear-gradient(180deg,var(--accent-top),var(--accent-bot));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 20px -12px rgba(37,99,235,.8)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:#0d1218;border-color:#202834}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.w100{width:100%}

/* preview panel */
.preview{width:320px;flex:0 0 320px;display:flex;flex-direction:column;border-left:1px solid var(--line);
  background:linear-gradient(180deg,#0a0c11,#090b0f);min-height:0}
.pv-head{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  border-bottom:1px solid rgba(255,255,255,.04);font-size:11px;letter-spacing:.08em;color:#5d6673;font-weight:600}
.pv-body{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 18px}
.pv-art{width:96px;height:96px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 22px 40px -30px #000}
.pv-art svg{width:100%;height:100%}
.pv-title{margin-top:14px;font-size:18px;font-weight:700;color:#fff;letter-spacing:-.01em;line-height:1.3}
.pv-en{margin-top:2px;font-size:11px;color:#6d7683;letter-spacing:.02em}
.pv-auth{margin-top:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10.5px;color:#7d8794}
.pv-desc{margin-top:12px;font-size:11.5px;line-height:1.7;color:#98a1ae;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pv-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.tag{height:20px;padding:0 7px;border-radius:4px;font-size:10px;display:inline-flex;align-items:center;gap:4px;
  background:#0f141b;border:1px solid #1a212b;color:#8b96a4;white-space:nowrap}
.tag.hot{color:#9fb6d8;border-color:#20303f;background:#0e1620}
.pv-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:16px;background:#171d26;border:1px solid #171d26;border-radius:8px;overflow:hidden}
.pv-stat{background:#0c1016;padding:9px 11px}
.pv-stat .k{font-size:9.5px;letter-spacing:.06em;color:#5d6673}
.pv-stat .v{margin-top:3px;font-size:13.5px;font-weight:600;color:#eaf0fb;font-variant-numeric:tabular-nums}
.pv-actions{margin-top:16px;display:flex;flex-direction:column;gap:7px}
.pv-meta{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;gap:8px}
.pv-meta div{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:#5d6673}
.pv-meta b{color:#98a1ae;font-weight:500;font-variant-numeric:tabular-nums;max-width:62%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:#5d6673;gap:6px}
.pv-empty .ei{width:40px;height:40px;border-radius:11px;border:1px solid #1b222c;background:#0d1117;display:grid;place-items:center;color:#4d5764}

/* skeleton */
.sk{position:relative;overflow:hidden;background:#121821;border-radius:4px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);animation:sweep 1.4s infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.sk-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 84px 84px 104px;gap:12px;align-items:center;height:56px;padding:0 18px;border-bottom:1px solid #0f1319}
.sk-name{display:flex;align-items:center;gap:10px}

/* detail */
.detail{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.backbar{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:0 20px;border-bottom:1px solid rgba(255,255,255,.045);background:rgba(8,9,13,.6)}
.crumb{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#6d7683;min-width:0}
.crumb button{display:flex;align-items:center;gap:7px;height:28px;padding:0 9px 0 7px;border-radius:6px;color:#98a1ae;font-size:12px;transition:.12s}
.crumb button:hover{background:#11161d;color:#fff}
.crumb .sep{color:#39414d}
.crumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-r{display:flex;align-items:center;gap:8px}
.winbtns{display:flex;gap:2px;margin-left:6px;padding-left:12px;border-left:1px solid #1a1f28}
.winbtns i{display:grid;place-items:center;width:30px;height:28px;border-radius:6px;color:#5d6673;cursor:pointer}
.winbtns i:hover{background:#11161d;color:#c3ccd9}
.winbtns i:last-child:hover{background:#2a1418;color:#f87171}
.dwrap{flex:1;min-height:0;overflow-y:auto;padding:20px 22px 26px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:22px;align-items:start}

.d-title-row{display:flex;gap:14px;align-items:flex-start}
.d-art{width:88px;height:88px;flex:0 0 88px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 36px -28px #000}
.d-art svg{width:100%;height:100%}
.d-h1{margin:2px 0 0;font-size:24px;line-height:1.25;font-weight:700;color:#fff;letter-spacing:-.01em}
.d-sub{margin-top:3px;font-size:11.5px;color:#6d7683;letter-spacing:.02em}
.d-badges{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;font-size:11px;color:#7d8794}
.src-badge{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 8px;border-radius:5px;
  border:1px solid #202a38;background:#0e131a;font-size:10.5px;color:#c3ccd9}
.src-badge .dotm{width:5px;height:5px;border-radius:3px;background:#4ade80;box-shadow:0 0 7px rgba(74,222,128,.55)}
.src-badge.cf{border-color:#3a2a1c;background:#140f0a}
.src-badge.cf .dotm{background:#f97316;box-shadow:0 0 7px rgba(249,115,22,.6)}
.d-auth{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:#7d8794;flex-wrap:wrap}
.d-auth .sp{flex:none;width:3px;height:3px;border-radius:3px;background:#39414d}
.d-auth b{color:#c3ccd9;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{border:1px solid #171d26;border-radius:8px;padding:9px 11px;background:linear-gradient(180deg,#0d1117,#0b0e13)}
.stat .k{font-size:12px;line-height:1.2;letter-spacing:normal;color:#8a94a2;display:flex;align-items:center;gap:7px;white-space:nowrap}
.stat .k .ico{opacity:.85;flex:none}
.stat .v{margin-top:7px;line-height:1.15;font-size:16px;font-weight:600;color:#eaf0fb;font-variant-numeric:tabular-nums}
.stat .v small{font-size:10px;color:#6d7683;font-weight:400;margin-left:2px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 9px;font-size:12.5px;font-weight:600;color:#e8ebf2}
.sec-h::before{content:"";width:3px;height:11px;border-radius:2px;background:linear-gradient(180deg,var(--accent-top),var(--accent-bot))}
.sec-h .cnt{font-size:10px;color:#4d5764;font-weight:400;margin-left:2px}
.vtable{margin-top:16px;border:1px solid #171d26;border-radius:8px;overflow:hidden;background:#0b0e13}
.vt-head,.vt-row{display:grid;grid-template-columns:minmax(0,1.7fr) 74px 74px 68px 92px 66px;gap:10px;align-items:center;padding:0 12px}
.vt-head{height:30px;font-size:9.5px;letter-spacing:.05em;color:#5d6673;border-bottom:1px solid #171d26;background:#0c1016;font-weight:600}
.vt-row{height:34px;font-size:11px;color:#b6bfcc;border-bottom:1px solid rgba(255,255,255,.032)}
.vt-row:last-child{border-bottom:0}
.vt-row:hover{background:#0f141b}
.vt-row .vn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dbe2ec;font-variant-numeric:tabular-nums}
.vt-row .num{color:#98a1ae;font-variant-numeric:tabular-nums}
.tag.t-rel{color:#86efac;border-color:rgba(74,222,128,.25);background:rgba(74,222,128,.07)}
.tag.t-beta{color:#fcd34d;border-color:rgba(245,158,11,.28);background:rgba(245,158,11,.07)}
.deps-mini{margin-top:16px;border:1px solid #171d26;border-radius:8px;overflow:hidden;background:#0b0e13}
.dep-row{display:flex;align-items:center;gap:8px;height:30px;padding:0 11px;border-bottom:1px solid rgba(255,255,255,.03);font-size:11px}
.dep-row:last-child{border-bottom:0}
.dep-row .ic{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:#121821;border:1px solid #1d2530;color:#8fa0b6}
.dep-row .nm{color:#b6bfcc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dep-row .k{margin-left:auto;font-size:9px;padding:1px 5px;border-radius:4px;border:1px solid #1d2530;color:#5d6673}
.dep-row .k.req{color:#9fc3fb;border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.08)}
.sim-mini{margin-top:16px;display:flex;flex-direction:column}
.sim-row{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px;border-radius:7px;cursor:pointer;transition:.12s}
.sim-row:hover{background:#0f141b}
.sim-row .art{width:30px;height:30px;border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,.07);flex:none}
.sim-row .art svg{width:100%;height:100%}
.sim-row .nm{min-width:0}
.sim-row .cn{font-size:12px;color:#e8ebf2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-row .mt{font-size:10px;color:#5d6673;margin-top:1px;font-variant-numeric:tabular-nums}
.sim-row .dl{margin-left:auto;font-size:10.5px;color:#7d8794;font-variant-numeric:tabular-nums}

/* install panel */
.install{position:sticky;top:0;border:1px solid #1b222c;border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,#0c1016,#0a0d12);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 50px -42px #000}
.inst-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;
  border-bottom:1px solid rgba(255,255,255,.05);background:linear-gradient(180deg,rgba(59,130,246,.055),transparent)}
.inst-head .t{font-size:12.5px;font-weight:600;color:#fff;display:flex;align-items:center;gap:7px}
.inst-head .t svg{color:#8fb6f8}
.st{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border-radius:5px;font-size:10px;
  border:1px solid #232b37;background:#0e1218;color:#98a1ae}
.st .d{width:5px;height:5px;border-radius:3px;background:#5d6673}
.st.run{color:#9fc3fb;border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.1)}
.st.run .d{background:#60a5fa;box-shadow:0 0 7px rgba(96,165,250,.9);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.st.done{color:#86efac;border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08)}
.st.done .d{background:#4ade80}
.st.bad{color:#fca5a5;border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}
.st.bad .d{background:#f87171}
.inst-body{padding:11px 13px 13px}
.field{margin-bottom:9px}
.field label{display:block;font-size:9.5px;letter-spacing:.07em;color:#5d6673;margin-bottom:4px;font-weight:600}
.sel{width:100%;height:32px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 9px;
  border-radius:6px;border:1px solid #202834;background:#0d1219;color:#dbe2ec;font-size:11.5px;transition:.12s}
.sel:hover{border-color:#2d3a4a;background:#0f151d}
.sel svg{color:#6d7683}
.vl-head{display:flex;justify-content:space-between;padding:3px 2px 5px;font-size:9.5px;letter-spacing:.06em;color:#4d5764;font-weight:600}
.vl{max-height:126px;overflow-y:auto;border:1px solid #191f28;border-radius:7px;background:#0a0d12;padding:3px}
.vrow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;height:30px;padding:0 8px;
  border-radius:5px;cursor:pointer;transition:background .1s}
.vrow:hover{background:#11161e}
.vrow .vn{font-size:10.5px;color:#b6bfcc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.vrow .vs{font-size:9.5px;color:#4d5764;font-variant-numeric:tabular-nums;flex:none}
.vrow.on{background:rgba(59,130,246,.12)}
.vrow.on .vn{color:#dbeafe}
.vrow.on .vs{color:#8fb6f8}
.vrow.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--accent)}
.inst-actions{margin-top:11px}
.install-btn{width:100%;height:38px;font-size:12.5px;border-radius:8px;font-weight:500}
.inst-foot{margin-top:7px;font-size:9.5px;color:#4d5764;text-align:center;font-variant-numeric:tabular-nums}
.prog{margin-top:9px;display:none}
.prog.show{display:block}
.bar{height:4px;border-radius:3px;background:#171d26;overflow:hidden}
.bar i{display:block;height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,var(--accent-bot),var(--accent-top));box-shadow:0 0 12px rgba(59,130,246,.7);transition:width .18s linear}
.prog .row2{display:flex;justify-content:space-between;margin-top:5px;font-size:9.5px;color:#6d7683}
.prog .row2 b{color:#bcd7ff;font-weight:500;font-variant-numeric:tabular-nums}
.loc{margin-top:10px;padding:8px 9px 9px;border:1px dashed #1e2530;border-radius:7px;background:#0a0d12}
.loc-k{font-size:9.5px;letter-spacing:.06em;color:#4d5764;font-weight:600}
.loc-p{margin-top:3px;font-size:10.5px;color:#c3ccd9;font-family:Consolas,"Cascadia Mono","Courier New",monospace;word-break:break-all;line-height:1.45}
.loc-b{width:100%;margin-top:7px;height:26px;font-size:10.5px}
.inst-note{margin-top:8px;padding-top:8px;border-top:1px dashed #1a2029;font-size:9px;line-height:1.6;color:#4b535f}

/* states */
.state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.state .ei{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;
  border:1px solid #2a2530;background:linear-gradient(180deg,#161016,#0e0d12);color:#f0a0a0}
.state h4{margin:0;font-size:13.5px;color:#e8ebf2;font-weight:600}
.state p{margin:6px 0 0;font-size:11.5px;line-height:1.7;color:#7d8794;max-width:360px}
.state .acts{display:flex;gap:8px;margin-top:14px;justify-content:center}
.state .foot{margin-top:12px;font-size:9.5px;color:#414a56}

.menu{position:fixed;z-index:90;min-width:170px;padding:5px;border-radius:8px;border:1px solid #242c38;background:#0e131a;
  box-shadow:0 24px 50px -20px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.05);display:none}
.menu.show{display:block;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.menu .mi{display:flex;align-items:center;gap:8px;height:29px;padding:0 9px;border-radius:5px;font-size:11.5px;color:#b6bfcc;cursor:pointer;width:100%}
.menu .mi:hover{background:#151c26;color:#fff}
.menu .mi.on{color:#dbeafe;background:rgba(59,130,246,.12)}
.menu .mi .ck{margin-left:auto;color:#60a5fa}

.toast{position:fixed;left:50%;bottom:22px;z-index:95;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:8px;background:#10151d;border:1px solid #2a3546;
  color:#dbe2ec;font-size:11.5px;box-shadow:0 22px 46px -22px rgba(0,0,0,.95);transition:opacity .16s,transform .16s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#60a5fa}

@media (max-width:1279px){
  .tree{width:176px;flex-basis:176px}
  .preview{width:288px;flex-basis:288px}
  .tbl-head,.row{grid-template-columns:minmax(0,1fr) 78px 76px 92px;padding:0 14px}
  .tbl-head span:nth-child(4),.row .c-up{display:none}
  .ltop{padding:0 14px}
  .dgrid{grid-template-columns:minmax(0,1fr) 300px;gap:18px}
  .vt-head,.vt-row{grid-template-columns:minmax(0,1.6fr) 66px 66px 62px 82px}
  .vt-head span:last-child,.vt-row span:last-child{display:none}
  .dwrap{padding:16px 18px 22px}
  .pv-body{padding:16px 14px}
}
@media (max-height:800px){
  .tree-head,.pv-head{height:46px}
  .ltop{height:50px}
  .row{height:52px}
  .sk-row{height:52px}
  .vl{max-height:104px}
  .inst-note{display:none}
  .d-art{width:76px;height:76px;flex-basis:76px}
  .d-h1{font-size:22px}
  .stats{gap:7px}
  .vt-row{height:32px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

          cur:null, inst:"idle", mc:"", loaderSel:"", selV:"", expanded:false };
var LOADER_ORDER = ["Fabric","NeoForge","Forge","Quilt","Iris","OptiFine","原版"];
var VER_LIST = ["1.21.4","1.21.1","1.20.6","1.20.1","1.19.2","1.18.2","1.12.2"];
var SORT_LABEL = { dl:"下载量", updated:"最近更新", name:"名称" };
var $ = function(id){ return document.getElementById(id); };
function byId(id){ for (var i=0;i<D.length;i++) if (D[i].id===id) return D[i]; return null; }
function catOf(id){ for (var i=0;i<CATS.length;i++) if (CATS[i].id===id) return CATS[i]; return CATS[0]; }
function rgba(hex,a){ var n = parseInt(hex.replace("#",""),16); return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; }
function splitSize(s){ var m=String(s).match(/^([\d.]+)\s*(.*)$/); return m?[m[1],m[2]]:[s,""]; }
function fmtDl(n){ if(n>=1e6) return (n/1e6).toFixed(1)+"M"; if(n>=1e3) return Math.round(n/1e3)+"K"; return ""+n; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var CLIENT_MAP = { sodium:"客户端", iris:"客户端", jei:"客户端", xaero:"客户端", jade:"客户端", distantthorizons:"客户端",
  lithium:"双端", ae2:"双端", botania:"双端", twilight:"双端", create:"双端", farmersdelight:"双端", alexsmobs:"双端", sophisticated:"双端" };
function clientOf(it){ return CLIENT_MAP[it.id] || "双端"; }
function sourceLocked(){
  if (S.cat === "shader" || S.cat === "pack") return !!S.ver;
  if (S.cat === "mod") return !!(S.lic || S.env);
  return false;
}

function itemsOfCat(cat){ return D.filter(function(x){ return cat==="all" || x.cat===cat; }); }

function filtered(){
  var q = S.q.trim().toLowerCase();
  var out = D.filter(function(it){
    if (S.cat !== "all" && it.cat !== S.cat) return false;
    if (S.src && it.src !== S.src) return false;
    if (S.loader && it.loaders.indexOf(S.loader) < 0) return false;
    if (S.ver && it.vers.indexOf(S.ver) < 0) return false;
    if (q){
      var hay = (it.cn+" "+it.en+" "+it.desc+" "+it.tags.join(" ")+" "+it.loaders.join(" ")+" "+it.vers.join(" ")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  out.sort(function(a,b){
    if (S.sort === "dl") return b.dl - a.dl;
    if (S.sort === "updated") return a.ts - b.ts;
    return a.en.localeCompare(b.en);
  });
  return out;
}

/* ══════════ 左树 ══════════ */
function renderTree(){
  var scope = itemsOfCat(S.cat);
  var showLoader = (S.cat === "mod" || S.cat === "modpack");
  var loaders = [];
  if (showLoader){
    LOADER_ORDER.forEach(function(l){
      for (var i=0;i<scope.length;i++) if (scope[i].loaders.indexOf(l) >= 0){ loaders.push(l); break; }
    });
  }
  var vers = VER_LIST.filter(function(v){
    for (var i=0;i<scope.length;i++) if (scope[i].vers.indexOf(v) >= 0) return true;
    return false;
  });
  var h = "";
  h += '<div class="tg"><div class="tg-t">分类 <em>CATEGORY</em></div>';
  CATS.forEach(function(c){
    var n = c.id === "all" ? D.length : itemsOfCat(c.id).length;
    h += '<div class="ti'+(S.cat===c.id?" on":"")+'" data-cat="'+c.id+'" role="button" tabindex="0">'
      + ico(c.icon,"s13") + '<span>'+(c.id==="all"?"全部资源":c.label)+'</span>'
      + '<span class="n">'+n+'</span></div>';
  });
  h += '</div>';

  if (showLoader){
    h += '<div class="tg"><div class="tg-t">加载器 <em>LOADER</em></div><div class="sub">';
    h += '<div class="si'+(S.loader===""?" on":"")+'" data-loader="">不限</div>';
    loaders.forEach(function(l){
      h += '<div class="si'+(S.loader===l?" on":"")+'" data-loader="'+l+'">'+l+'</div>';
    });
    h += '</div></div>';
  }

  h += '<div class="tg"><div class="tg-t">游戏版本 <em>VERSION</em></div><div class="sub">';
  h += '<div class="si'+(S.ver===""?" on":"")+'" data-ver="">全部</div>';
  vers.forEach(function(v){
    h += '<div class="si'+(S.ver===v?" on":"")+'" data-ver="'+v+'">'+v+'</div>';
  });
  h += '</div></div>';

  if (S.cat === "data"){
    h += '<div class="tg"><div class="tg-t">排序 <em>SORT</em></div><div class="sub">';
    [["dl","下载量最高"],["updated","最近更新"],["name","名称 A–Z"]].forEach(function(s){
      h += '<div class="si'+(S.sort===s[0]?" on":"")+'" data-sort="'+s[0]+'">'+s[1]+'</div>';
    });
    h += '</div></div>';
  }
  $("tree").innerHTML = h;

  var lock = sourceLocked();
  var srcTxt = S.src ? ("仅 " + S.src) : "Modrinth · CurseForge";
  $("treeFoot").innerHTML = '<span class="dots"><i class="'+(S.src==="CurseForge"?"off":"")+'"></i>'
    + '<i class="'+(S.src==="Modrinth"?"off":"cf")+'"></i></span>'
    + '<b>'+srcTxt+'</b>'
    + (lock ? '<br>筛选条件会跳过 CurseForge 来源' : '<br>两种来源的结果都会展示');
}

function shrink(size, i){
  var sp = splitSize(size); var v = parseFloat(sp[0]);
  if (isNaN(v) || i === 0) return size;
  var nv = v * (1 - i * 0.045);
  return (nv >= 100 ? nv.toFixed(0) : nv.toFixed(nv < 10 ? 1 : 0)) + " " + sp[1];
}

        + '<button class="btn sm ghost" id="vtMore">' + (S.expanded ? "收起" : "展开全部 " + rows.length + " 个文件") + '</button></div>' : '')
    + '</div>'

    + '<div style="margin-top:16px"><div class="sec-h">依赖<span class="cnt">必需 ' + reqN + ' · 可选 ' + (deps.length - reqN) + '</span></div>'
    +   '<div class="deps-mini">'
    +   (deps.length ? deps.map(function(d){
          return '<div class="dep-row"><span class="ic">' + ico("package","s11") + '</span>'
            + '<span class="nm">' + d[0] + '</span>'
            + '<span class="k' + (d[1] === "必需" ? " req" : "") + '">' + d[1] + '</span></div>';
        }).join("") : '<div class="dep-row"><span class="nm" style="color:#5d6673">无前置依赖</span></div>')
    +   '</div>'
    +   '<div style="margin-top:6px;font-size:9.5px;color:#414a56">依赖为项目级清单（名称 / 图标 / slug）；版本约束需后端新增接口。</div>'
    + '</div>'

    + '<div style="margin-top:16px"><div class="sec-h">相似资源</div><div class="sim-mini">'
    + sims.map(function(x){
        return '<div class="sim-row" data-id="' + x.id + '"><div class="art">' + art(x) + '</div>'
          + '<div class="nm"><div class="cn">' + x.cn + '</div><div class="mt">' + x.en + ' · 更新 ' + x.up + '</div></div>'
          + '<div class="dl">' + x.dlT + '</div></div>';
      }).join("")
    + '</div></div>'
    + '</div>'

    + installPanelHTML(it)
    + '</div>';

  $("dwrap").innerHTML = html;
  fillVersions();
  updateInstall();
}

var INST_PATH = { mod:".minecraft/mods", shader:".minecraft/shaderpacks", pack:".minecraft/resourcepacks",
                  modpack:"downloads/", data:"world/datapacks/" };
function instPath(it){ return INST_PATH[it.cat] || ".minecraft/mods"; }

function installPanelHTML(it){
  var isData = it.cat === "data";
  var isPack = it.cat === "modpack";
  var h = '<aside class="install">';
  h += '<div class="inst-head"><div class="t">' + ico("download","s14") + (isData ? '下载' : '安装') + '</div>'
    +  '<div class="st" id="instState"><span class="d"></span>' + (isData ? '未下载' : '未安装') + '</div></div>';
  h += '<div class="inst-body">';
  h +=   '<div class="field"><label>' + (isData ? '对应游戏版本' : '游戏版本') + '</label>'
    +      '<button class="sel" id="selMc"><span>' + S.mc + '</span>' + ico("chevron-down","s13") + '</button></div>';
  if (!isData && S.cur.loaders.length > 1){
    h += '<div class="field"><label>加载器</label><button class="sel" id="selLoader"><span>' + S.loaderSel + '</span>' + ico("chevron-down","s13") + '</button></div>';
  }
  h +=   '<div class="vl-head"><span>历史版本</span><span>大小</span></div>'
    +    '<div class="vl" id="vl"></div>'
    +    '<div class="inst-actions">'
    +      '<button class="btn primary install-btn" id="installBtn">' + ico("download","s14") + '<span>' + (isData ? '下载到本地' : '下载并安装') + '</span></button>'
    +      '<div class="prog" id="prog"><div class="bar"><i id="barFill"></i></div><div class="row2"><span id="progLabel">正在下载…</span><b id="progPct">0%</b></div></div>'
    +      '<div class="loc"><div class="loc-k">' + (isData ? '放置位置' : '安装位置') + '</div>'
    +        '<div class="loc-p">' + instPath(it) + '</div>'
    +        '<button class="btn sm ghost loc-b" id="openFolder">' + ico("folder","s12") + '打开文件夹</button></div>'
    +      '<div class="inst-foot" id="instFoot"></div>'
    +      '<div class="inst-note">' + (isData
             ? '数据包没有安装接口，只下载到本地，需手动放进存档的 datapacks 目录。'
             : (isPack ? '整合包下载到本地后会导入为新的游戏实例。' : '安装状态由任务回传：未安装 / 下载中 / 失败。已安装与可更新状态待后端接口。')) + '</div>'
    +    '</div>'
    +  '</div></aside>';
  return h;
}

function fillVersions(){
  var el = $("vl"); if (!el || !S.cur) return;
  var rows = versionRows(S.cur);
  if (!S.selV){
    var pick = rows[0];
    for (var i=0;i<rows.length;i++) if (rows[i].mc === S.mc && rows[i].ld === S.loaderSel){ pick = rows[i]; break; }
    S.selV = pick ? pick.id : "";
  }
  el.innerHTML = rows.map(function(r){
    return '<div class="vrow' + (r.id === S.selV ? " on" : "") + '" data-v="' + r.id + '" role="button" tabindex="0">'
      + '<span class="vn">' + r.name + '</span><span class="vs">' + r.size + '</span></div>';
  }).join("");
}

function updateInstall(){
  var st = $("instState"), btn = $("installBtn"), prog = $("prog"), foot = $("instFoot");
  if (!st || !btn || !foot || !S.cur) return;
  var row = currentRow();
  var isData = S.cur.cat === "data";
  var W = isData ? { idle:"未下载", run:"下载中", done:"已下载", bad:"下载失败" }
                 : { idle:"未安装", run:"下载中", done:"下载完成", bad:"安装失败" };
  if (S.inst === "running"){
    st.className = "st run"; st.innerHTML = '<span class="d"></span>' + W.run;
    btn.disabled = true; btn.innerHTML = '<span>' + (isData ? "正在下载…" : "正在安装…") + '</span>';
    prog.classList.add("show");
  } else if (S.inst === "failed"){
    st.className = "st bad"; st.innerHTML = '<span class="d"></span>' + W.bad;
    btn.disabled = false; btn.innerHTML = ico("refresh","s14") + '<span>重试</span>';
    prog.classList.remove("show");
    foot.textContent = "连接超时 · 校验未通过，可重试";
  } else if (S.inst === "done"){
    st.className = "st done"; st.innerHTML = '<span class="d"></span>' + W.done;
    btn.disabled = false; btn.innerHTML = ico("refresh","s14") + '<span>重新下载</span>';
    prog.classList.remove("show");
    foot.textContent = isData
      ? "已保存到下载目录 · 放进 " + instPath(S.cur) + " 生效"
      : "已完成 " + (row ? row.name : "") + " 的下载与校验";
  } else {
    st.className = "st"; st.innerHTML = '<span class="d"></span>' + W.idle;
    btn.disabled = false; btn.innerHTML = ico("download","s14") + '<span>' + (isData ? "下载到本地" : "下载并安装") + '</span>';
    prog.classList.remove("show");
    foot.textContent = row ? (row.name + " · " + row.size) : S.cur.size;
  }
}

function startInstall(){
  if (S.inst === "running" || !S.cur) return;
  var row = currentRow(); if (!row) return;
  S.inst = "running"; updateInstall();
  var pct = 0;
  var willFail = location.search.indexOf("fail") >= 0;
  clearInterval(S.timer);
  S.timer = setInterval(function(){
    pct += Math.random() * 6.2 + 2.4;
    if (pct > 100) pct = 100;
    if (willFail && pct > 76) pct = 76;
    var f = $("barFill"), pl = $("progPct"), lb = $("progLabel");
    if (!f || !pl || !lb){ clearInterval(S.timer); return; }
    f.style.width = pct.toFixed(1) + "%"; pl.textContent = Math.round(pct) + "%";
    lb.textContent = pct < 56 ? "正在下载 " + row.name
      : (pct < 88 ? (S.cur.cat === "data" ? "正在保存到下载目录"
          : "正在写入 .minecraft/" + (S.cur.cat === "shader" ? "shaderpacks" : S.cur.cat === "pack" ? "resourcepacks" : S.cur.cat === "modpack" ? "instances" : "mods"))
      : "正在校验文件签名");
    if (willFail && pct >= 76){ clearInterval(S.timer); S.inst = "failed"; updateInstall(); toast("安装失败 · 连接超时","alert-triangle"); return; }
    if (pct >= 100){ clearInterval(S.timer); S.inst = "done"; updateInstall();
      toast(S.cur.cat === "data" ? "已下载 · 放至 " + instPath(S.cur) + " 生效" : "下载完成 · 已校验 " + S.cur.cn, "check"); }
  }, 80);
}

/* ══════════ 三态 ══════════ */
var FORCE_STATE = ((location.search.match(/[?&]state=([a-z]+)/) || [])[1] || "");

function skRow(){
  return '<div class="sk-row"><div class="sk-name">'
    + '<div class="sk" style="width:32px;height:32px;border-radius:7px;flex:none"></div>'
    + '<div style="flex:1"><div class="sk" style="width:46%;height:11px"></div>'
    + '<div class="sk" style="width:30%;height:9px;margin-top:6px"></div></div></div>'
    + '<div class="sk" style="width:52px;height:10px;margin-left:auto"></div>'
    + '<div class="sk" style="width:56px;height:10px;margin-left:auto"></div>'
    + '<div class="sk" style="width:52px;height:10px;margin-left:auto"></div>'
    + '<div class="sk" style="width:60px;height:10px;margin-left:auto"></div>'
  + '</div>';
}

function skPreview(){
  return '<div class="pv-head"><span>预览</span></div><div class="pv-body">'
    + '<div class="sk" style="width:96px;height:96px;border-radius:14px"></div>'
    + '<div class="sk" style="width:60%;height:18px;margin-top:16px"></div>'
    + '<div class="sk" style="width:38%;height:10px;margin-top:8px"></div>'
    + '<div style="margin-top:16px"><div class="sk" style="width:100%;height:9px"></div>'
    + '<div class="sk" style="width:92%;height:9px;margin-top:7px"></div>'
    + '<div class="sk" style="width:64%;height:9px;margin-top:7px"></div></div>'
    + '<div style="margin-top:16px" class="sk"></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:16px;border:1px solid #171d26;border-radius:8px;overflow:hidden">'
    + '<div style="background:#0c1016;height:52px"></div><div style="background:#0c1016;height:52px"></div>'
    + '<div style="background:#0c1016;height:52px"></div><div style="background:#0c1016;height:52px"></div></div>'
    + '<div class="sk" style="width:100%;height:34px;margin-top:16px"></div>'
  + '</div>';
}

function renderState(kind){
  if (kind === "loading"){
    var n = 12;
    $("rows").innerHTML = new Array(n).fill(0).map(skRow).join("");
    $("count").textContent = "—";
    $("preview").innerHTML = skPreview();
    return;
  }
  if (kind === "timeout"){
    $("rows").innerHTML = '<div class="state"><div class="ei">' + ico("alert-triangle","s22") + '</div>'
      + '<h4>请求超时</h4><p>9 秒内没有收到 Modrinth / CurseForge 的响应。可能是网络受限，或资源站暂时不可用。</p>'
      + '<div class="acts"><button class="btn primary sm" id="retryBtn">' + ico("refresh","s12") + '重试</button>'
      + '<button class="btn sm ghost" id="openSite">' + ico("external","s12") + '打开资源站</button></div>'
      + '<div class="foot">后端不会返回 failed 信号 · 超时由 UI 侧 9s 兜底</div></div>';
    $("count").textContent = "—";
    $("preview").innerHTML = '<div class="pv-head"><span>预览</span></div>'
      + '<div class="pv-empty"><div class="ei">' + ico("alert-triangle","s20") + '</div><div style="font-size:12px">无法加载预览</div>'
      + '<div style="font-size:10.5px;color:#4d5764">等待资源站恢复后重试</div></div>';
    $("retryBtn").onclick = function(){ location.reload(); };
    $("openSite").onclick = function(){ toast("已在浏览器中打开 modrinth.com","external"); };
    return;
  }
  if (kind === "empty"){
    $("rows").innerHTML = '<div class="state" style="color:#6d7683"><div class="ei" style="border-color:#1e242e;background:#0d1117;color:#4d5764">'
      + '<svg class="ico s20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>'
      + '<h4 style="color:#b6bfcc">没有匹配的资源</h4><p>当前筛选组合下两个来源都没有结果，试试放宽条件。</p>'
      + '<div class="acts"><button class="btn sm" id="emptyReset2">清除筛选</button></div></div>';
    $("count").textContent = "0";
    $("preview").innerHTML = '<div class="pv-head"><span>预览</span></div>'
      + '<div class="pv-empty"><div class="ei">' + ico("search","s20") + '</div><div style="font-size:12px">没有可预览的资源</div></div>';
    $("emptyReset2").onclick = resetFilters;
  }
}

/* ══════════ 浮层 ══════════ */
var toastTimer = null;
function toast(msg, icon){
  var t = $("toast");
  t.innerHTML = ico(icon || "check","s14") + '<span>' + msg + '</span>';
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function closeMenu(){ var m = $("menu"); m.classList.remove("show"); m.innerHTML = ""; }
function openMenu(anchor, items, cur, onPick){
  var m = $("menu");
  m.innerHTML = items.map(function(it){
    return '<button class="mi' + (it.value === cur ? " on" : "") + '" data-val="' + it.value + '">'
      + it.label + (it.value === cur ? '<span class="ck">' + ico("check","s12") + '</span>' : '') + '</button>';
  }).join("");
  m.classList.add("show");
  var r = anchor.getBoundingClientRect();
  m.style.minWidth = Math.max(r.width, 168) + "px";
  m.style.left = Math.round(Math.min(r.left, window.innerWidth - m.offsetWidth - 12)) + "px";
  var top = r.bottom + 6;
  if (top + m.offsetHeight > window.innerHeight - 10) top = r.top - m.offsetHeight - 6;
  m.style.top = Math.round(top) + "px";
  m.onclick = function(e){
    var b = e.target.closest(".mi"); if (!b) return;
    closeMenu(); onPick(b.getAttribute("data-val"));
  };
}

/* ══════════ 事件 ══════════ */
function bindAll(){
  $("q").addEventListener("input", function(e){ S.q = e.target.value; renderRows(); });

  $("tree").addEventListener("click", function(e){
    var el = e.target.closest("[data-cat],[data-loader],[data-ver],[data-sort]");
    if (!el) return;
    if (el.hasAttribute("data-cat")) setCat(el.getAttribute("data-cat"));
    else if (el.hasAttribute("data-loader")){ S.loader = el.getAttribute("data-loader"); renderTree(); renderRows(); }
    else if (el.hasAttribute("data-ver")){ S.ver = el.getAttribute("data-ver"); renderTree(); renderRows(); }
    else { S.sort = el.getAttribute("data-sort"); renderTree(); renderRows(); }
  });

  $("srcSeg").addEventListener("click", function(e){
    var b = e.target.closest("[data-src]"); if (!b) return;
    S.src = b.getAttribute("data-src"); syncSrcSeg(); renderTree(); renderRows();
  });

  $("resetAll").addEventListener("click", resetFilters);

  $("rows").addEventListener("click", function(e){
    var dl = e.target.closest("[data-dl]");
    if (dl){ e.stopPropagation(); toast("开始下载 · " + byId(dl.getAttribute("data-dl")).cn, "download"); return; }
    var row = e.target.closest(".row");
    if (row){ selectRow(row.getAttribute("data-id")); }
  });
  $("rows").addEventListener("dblclick", function(e){
    var row = e.target.closest(".row");
    if (row) openDetail(row.getAttribute("data-id"), true);
  });
  $("rows").addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    var row = e.target.closest(".row");
    if (row){ e.preventDefault(); openDetail(row.getAttribute("data-id"), true); }
  });

  $("backbar").addEventListener("click", function(e){
    if (e.target.closest("#backBtn")) backToList();
  });

  $("dwrap").addEventListener("click", function(e){
    if (!S.cur) return;
    if (e.target.closest("#installBtn")){ startInstall(); return; }
    if (e.target.closest("#openFolder")){ toast("已打开 " + instPath(S.cur), "folder"); return; }
    if (e.target.closest("#vtMore")){ S.expanded = !S.expanded; renderDetail(); return; }
    var mc = e.target.closest("#selMc");
    if (mc){
      openMenu(mc, S.cur.vers.map(function(v){ return { value:v, label:v }; }), S.mc, function(v){
        S.mc = v; S.selV = ""; fillVersions(); updateInstall();
        var l = $("selMc"); if (l) l.firstElementChild.textContent = v;
      });
      return;
    }
    var ld = e.target.closest("#selLoader");
    if (ld){
      openMenu(ld, S.cur.loaders.map(function(v){ return { value:v, label:v }; }), S.loaderSel, function(v){
        S.loaderSel = v; S.selV = ""; fillVersions(); updateInstall();
        var l2 = $("selLoader"); if (l2) l2.firstElementChild.textContent = v;
      });
      return;
    }
    var vr = e.target.closest(".vrow");
    if (vr){
      S.selV = vr.getAttribute("data-v");
      var rows = $("vl").querySelectorAll(".vrow");
      for (var i=0;i<rows.length;i++) rows[i].classList.toggle("on", rows[i] === vr);
      updateInstall();
      return;
    }
    var sim = e.target.closest(".sim-row");
    if (sim){ openDetail(sim.getAttribute("data-id"), true); return; }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "/" && document.activeElement !== $("q")){ e.preventDefault(); $("q").focus(); }
    else if (e.key === "Escape"){ closeMenu(); if (document.activeElement === $("q")) $("q").blur(); }
  });
  document.addEventListener("click", function(e){
    if (!e.target.closest("#menu") && !e.target.closest(".sel")) closeMenu();
  });
  window.addEventListener("hashchange", route);
}

function selectRow(id){
  S.selId = id;
  var rows = $("rows").querySelectorAll(".row");
  for (var i=0;i<rows.length;i++) rows[i].classList.toggle("on", rows[i].getAttribute("data-id") === id);
  renderPreview();
}

function init(){
  bindAll();
  syncSrcSeg();
  renderTree();
  if (FORCE_STATE) { renderRows(); renderState(FORCE_STATE); }
  else renderRows();
  route();
}
init();

})();
</script>
</body>
</html>
