<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shadow 资源库 · 货架式</title>
<style>
:root{
  --bg:#08090d; --sidebar:#0a0b0f; --line:#14171d; --line2:#262b35;
  --fg:#e8ebf2; --fg2:#98a1ae; --fg3:#5d6673;
  --accent:#3b82f6; --accent-top:#4b8cf7; --accent-bot:#2563eb;
  --ok:#4ade80; --warn:#f59e0b; --danger:#ef4444;
  --r:8px; --r2:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  background:#08090d;color:#e8ebf2;
  font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:13px;line-height:1.55;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;outline:none}
input{font-family:inherit}
::selection{background:rgba(59,130,246,.35)}
svg{display:block}
.ico{width:16px;height:16px;flex:none}
.ico.s11{width:11px;height:11px}.ico.s12{width:12px;height:12px}.ico.s13{width:13px;height:13px}
.ico.s14{width:14px;height:14px}.ico.s15{width:15px;height:15px}.ico.s17{width:17px;height:17px}
.ico.s18{width:18px;height:18px}.ico.s20{width:20px;height:20px}.ico.s22{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1a202a;border:3px solid transparent;background-clip:padding-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#29323f;background-clip:padding-box}
.scroll-x{overflow-x:auto;overflow-y:hidden}
.scroll-x::-webkit-scrollbar{height:8px}

.app{position:relative;display:flex;height:100vh;width:100vw;overflow:hidden;
  background:
    radial-gradient(1120px 560px at 64% -16%, rgba(59,130,246,.10), transparent 62%),
    radial-gradient(780px 460px at 2% 108%, rgba(59,130,246,.055), transparent 64%),
    #08090d}

/* ───────── rail ───────── */
.rail{position:relative;z-index:6;width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;
  padding:14px 0 12px;gap:6px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,#0b0d12 0%,#090a0e 100%)}
.brand{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px;
  background:linear-gradient(160deg,#16233a,#0d1420);border:1px solid #243148;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px -10px rgba(59,130,246,.9)}
.rail-nav{display:flex;flex-direction:column;gap:4px;align-items:center}
.nav{position:relative;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:#5d6673;
  transition:background .12s ease,color .12s ease}
.nav:hover{color:#aab3c0;background:#11151c}
.nav.on{color:#eaf0fb;background:linear-gradient(180deg,#151d29,#111720)}
.nav.on::before{content:"";position:absolute;left:-12px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);
  box-shadow:0 0 10px rgba(59,130,246,.65)}
.nav[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:48px;top:50%;transform:translateY(-50%);
  background:#141a23;border:1px solid #242e3c;color:#dbe2ec;font-size:11px;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:20;
  box-shadow:0 10px 24px -12px #000}
.rail .sp{flex:1}
.rail-ver{font-size:10px;color:#3f4854;letter-spacing:.04em;writing-mode:horizontal-tb;margin-top:8px}

/* ───────── workspace ───────── */
.workspace{flex:1;min-width:0;display:flex;overflow:hidden}
.view{display:none;flex:1;min-width:0;height:100%}
.view.active{display:flex}

/* ───────── filters ───────── */
.filters{width:220px;flex:0 0 220px;display:flex;flex-direction:column;overflow:hidden;
  border-right:1px solid var(--line);background:linear-gradient(180deg,#0a0b0f,#0a0c11)}
.f-head{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px}
.f-head .t{font-size:13px;font-weight:600;color:#e8ebf2;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.f-head .t svg{color:#5d6673}
.f-reset{font-size:11px;color:#5d6673;padding:4px 8px;border-radius:6px;transition:.12s}
.f-reset:hover{color:#bcd7ff;background:rgba(59,130,246,.10)}
.f-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 10px 22px}
.fgroup{padding-top:12px}
.fgroup+.fgroup{margin-top:12px;border-top:1px solid rgba(255,255,255,.045);padding-top:14px}
.fg-title{display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px;
  font-size:10px;letter-spacing:.08em;color:#5d6673;font-weight:600}
.fg-title em{font-style:normal;font-weight:400;font-size:10px;color:#3f4854;letter-spacing:.02em}
.fitem{position:relative;display:flex;align-items:center;gap:9px;height:31px;padding:0 10px;border-radius:6px;
  color:#98a1ae;font-size:12.5px;cursor:pointer;transition:background .12s,color .12s}
.fitem:hover{background:#101419;color:#e8ebf2}
.fitem .cnt{margin-left:auto;font-size:10.5px;color:#4d5764;font-variant-numeric:tabular-nums}
.fitem.on{background:#11151c;color:#fff}
.fitem.on .cnt{color:#7fa9e8}
.fitem.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent);
  box-shadow:0 0 8px rgba(59,130,246,.5)}
.fitem .dot{width:6px;height:6px;border-radius:4px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:1px 6px 0}
.chip{height:25px;padding:0 9px;border-radius:6px;border:1px solid #1b2029;background:#0c0f14;color:#98a1ae;
  font-size:11px;display:inline-flex;align-items:center;gap:5px;transition:.12s;white-space:nowrap}
.chip:hover{border-color:#2b3646;color:#e8ebf2;background:#0f141b}
.chip.on{background:rgba(59,130,246,.13);border-color:rgba(59,130,246,.5);color:#bcd7ff}
.chip.on .ico{color:#8fb6f8}
.f-note{margin:14px 6px 0;padding:9px 10px;border:1px dashed #1d232d;border-radius:8px;font-size:10.5px;color:#5d6673;line-height:1.6}

/* ───────── main / topbar ───────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:22px 30px 16px}
.topbar{display:flex;align-items:center;gap:12px;flex:0 0 auto;height:46px}
.searchbar{flex:1;min-width:200px;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-radius:10px;border:1px solid #1b202a;
  background:linear-gradient(180deg,#0e1219,#0b0e14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  transition:border-color .14s,box-shadow .14s,background .14s}
.searchbar:hover{border-color:#242c39}
.searchbar:focus-within{border-color:rgba(59,130,246,.55);box-shadow:0 0 0 3px rgba(59,130,246,.10),inset 0 1px 0 rgba(255,255,255,.04);background:linear-gradient(180deg,#10151d,#0c1017)}
.searchbar svg{color:#5d6673}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:none;color:#e8ebf2;font-size:13px;height:100%}
.searchbar input::placeholder{color:#525c69}
.kbd{font-family:inherit;font-size:10px;line-height:1;color:#7d8794;border:1px solid #262d39;border-bottom-width:2px;
  border-radius:5px;padding:3px 5px;background:#12161d}
.count{font-size:11.5px;color:#6d7683;white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.count b{color:#dbe2ec;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.seg{display:flex;padding:3px;gap:2px;border:1px solid #171c24;background:#0b0e13;border-radius:9px;flex:none}
.seg button{height:28px;padding:0 10px;border-radius:6px;font-size:11.5px;color:#98a1ae;display:flex;align-items:center;gap:6px;
  white-space:nowrap;transition:background .12s,color .12s}
.seg button:hover{color:#e8ebf2;background:#12161d}
.seg button.on{background:linear-gradient(180deg,#1b2432,#161d28);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.seg.icons button{padding:0 7px}
.viewtog{display:flex;gap:2px;border:1px solid #171c24;background:#0b0e13;border-radius:9px;padding:3px}
.viewtog button{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#5d6673;transition:.12s}
.viewtog button:hover{color:#aab3c0;background:#12161d}
.viewtog button.on{color:#fff;background:#1a2230}

.tabsrow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:0 0 auto;height:38px;margin-top:10px}
.tabs{display:flex;align-items:center;gap:2px}
.tab{position:relative;height:34px;padding:0 11px;border-radius:8px;display:inline-flex;align-items:center;gap:7px;
  color:#98a1ae;font-size:12.5px;transition:background .12s,color .12s}
.tab svg{color:#6f7987;transition:color .12s}
.tab:hover{background:#101419;color:#e8ebf2}
.tab:hover svg{color:#98a1ae}
.tab.on{background:linear-gradient(180deg,#18202c,#131a24);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 1px 3px rgba(0,0,0,.35)}
.tab.on svg{color:#8fb6f8}
.tab .tcnt{font-size:10px;color:#5a6472;font-variant-numeric:tabular-nums;padding-left:1px}
.tab.on .tcnt{color:#7fa9e8}
.tabs-hint{font-size:11px;color:#4d5764;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tabs-hint b{color:#98a1ae;font-weight:500}

/* ───────── hero ───────── */
.hero{position:relative;flex:0 0 auto;height:128px;margin-top:14px;border-radius:12px;overflow:hidden;
  border:1px solid #1a2130;display:flex;align-items:center;padding:0 24px;cursor:pointer;
  background:
    radial-gradient(520px 200px at 84% 26%, var(--hero-glow,rgba(245,158,11,.16)), transparent 72%),
    linear-gradient(96deg,#0d121a 0%,#0b0f16 48%,#0b0f16 100%);
  transition:border-color .14s,box-shadow .14s}
.hero:hover{border-color:#2c3849;box-shadow:0 20px 44px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.045)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 62px);
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 52%);mask-image:linear-gradient(90deg,#000,transparent 52%)}
.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(59,130,246,.5),transparent)}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:400px;pointer-events:none}
.hero-art svg{width:100%;height:100%}
.hero-copy{position:relative;z-index:2;max-width:600px;min-width:0}
.hero-kicker{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;color:#8fb6f8;font-weight:600}
.hero-kicker .ln{width:16px;height:1px;background:linear-gradient(90deg,#3b82f6,transparent)}
.hero-title{display:flex;align-items:baseline;gap:10px;margin:5px 0 0;font-size:22px;font-weight:700;letter-spacing:.01em;line-height:1.25}
.hero-title small{font-size:11.5px;font-weight:400;color:#79828f;letter-spacing:.02em}
.hero-desc{margin-top:5px;font-size:12px;color:#98a1ae;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-meta{display:flex;align-items:center;gap:16px;margin-top:8px;font-size:11px;color:#6f7986}
.hero-meta span{display:flex;align-items:center;gap:5px}
.hero-meta b{color:#d5dce7;font-weight:600;font-variant-numeric:tabular-nums}
.hero-go{display:inline-flex;align-items:center;gap:6px;margin-left:4px;padding-left:16px;border-left:1px solid #232a36;
  color:#9fc3fb;font-size:11.5px;font-weight:500;transition:color .12s}
.hero:hover .hero-go{color:#cfe2ff}
.hero-go svg{transition:transform .14s}
.hero:hover .hero-go svg{transform:translateX(2px)}

/* ───────── grid ───────── */
.grid-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin-top:12px;padding:1px 2px 2px;display:flex;flex-direction:column}
.grid{flex:0 0 auto}
#empty,#stateBlock{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-content:start}
.card{position:relative;border-radius:10px;border:1px solid #191e27;padding:11px 12px 11px;min-height:0;
  display:flex;flex-direction:column;cursor:pointer;
  background:linear-gradient(180deg,#0d1117 0%,#0b0e13 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.028);
  transition:transform .13s cubic-bezier(.2,.7,.3,1),border-color .13s,box-shadow .13s,background .13s}
.card:hover{transform:translateY(-2px);border-color:#2d3a4c;
  box-shadow:0 14px 28px -18px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.05);
  background:linear-gradient(180deg,#10151c 0%,#0c1016 100%)}
.card:active{transform:translateY(0)}
.card:focus-visible{outline:2px solid rgba(59,130,246,.85);outline-offset:2px}
.card .top{display:flex;align-items:flex-start;gap:10px;padding-right:26px}
.card .art{width:48px;height:48px;flex:0 0 48px;border-radius:10px;overflow:hidden;position:relative;
  border:1px solid rgba(255,255,255,.075);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 4px 10px -6px rgba(0,0,0,.9)}
.card .art svg{width:100%;height:100%}
.card .nm{min-width:0;padding-top:1px}
.card .cn{font-size:13px;font-weight:600;color:#f0f3f8;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .en{font-size:10.5px;color:#5d6673;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.card .by{margin-top:8px;font-size:11px;color:#7d8794;display:flex;align-items:center;gap:5px;min-width:0}
.card .by span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .by b{color:#aab3c0;font-weight:500}
.card .hr{height:1px;margin:8px 0 7px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.015))}
.card .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:#6d7683}
.card .meta i{display:flex;align-items:center;gap:4px;font-style:normal;white-space:nowrap}
.card .meta b{color:#c3ccd9;font-weight:500;font-variant-numeric:tabular-nums}
.card .meta svg{color:#4d5764}
.card .tags{display:flex;gap:5px;margin-top:auto;padding-top:8px;overflow:hidden}
.tag{height:19px;padding:0 6px;border-radius:4px;font-size:10px;display:inline-flex;align-items:center;gap:4px;
  background:#0f141b;border:1px solid #1a212b;color:#8b96a4;white-space:nowrap;flex:none}
.tag.hot{color:#9fb6d8;border-color:#20303f;background:#0e1620}
.dl-ico{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  border:1px solid #2a3646;background:#131a24;color:#bcd0e8;opacity:0;transform:translateY(-3px);
  transition:opacity .13s,transform .13s,background .13s,border-color .13s}
.card:hover .dl-ico,.card:focus-within .dl-ico{opacity:1;transform:none}
.dl-ico:hover{background:rgba(59,130,246,.16);border-color:rgba(59,130,246,.55);color:#cfe2ff}
.dl-ico:focus-visible{outline:2px solid rgba(59,130,246,.8);outline-offset:1px}

.empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;color:#5d6673}
.empty .ei{width:44px;height:44px;margin:0 auto 12px;border-radius:12px;display:grid;place-items:center;
  border:1px solid #1e242e;background:#0d1117;color:#4d5764}
.empty h4{margin:0;color:#b6bfcc;font-size:13px;font-weight:600}
.empty p{margin:5px 0 14px;font-size:11.5px}
.empty button{height:30px;padding:0 12px;border-radius:7px;border:1px solid #2a3546;background:#121822;color:#bcd0e8;font-size:11.5px}
.empty button:hover{border-color:rgba(59,130,246,.5);color:#cfe2ff}

.listfoot{flex:0 0 auto;height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.lf-l{font-size:11px;color:#5d6673;display:flex;align-items:center;gap:8px}
.lf-l b{color:#98a1ae;font-weight:500}
.lf-r{display:flex;align-items:center;gap:6px}
.pg{display:flex;align-items:center;gap:2px;margin-right:6px}
.pg button{min-width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:11px;color:#7d8794;
  padding:0 7px;font-variant-numeric:tabular-nums;transition:.12s}
.pg button:hover:not(:disabled){background:#12161d;color:#e8ebf2}
.pg button.on{background:#18202c;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.pg button:disabled{opacity:.3;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:8px;
  border:1px solid #232b38;background:linear-gradient(180deg,#121820,#0d1219);color:#c6cfdb;font-size:12px;
  transition:.13s;white-space:nowrap}
.btn:hover{border-color:#334257;color:#fff;background:linear-gradient(180deg,#17202b,#0f151d)}
.btn:focus-visible{outline:2px solid rgba(59,130,246,.8);outline-offset:2px}
.btn.primary{border-color:rgba(59,130,246,.65);color:#fff;
  background:linear-gradient(180deg,var(--accent-top),var(--accent-bot));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 20px -10px rgba(37,99,235,.75)}
.btn.primary:hover{filter:brightness(1.06);border-color:rgba(96,165,250,.8)}
.btn.ghost{background:#0d1218;border-color:#202834}
.btn.sm{height:30px;padding:0 10px;font-size:11.5px;border-radius:7px}
.w100{width:100%}
.btn:disabled{opacity:.55;cursor:default;filter:none}

/* ───────── detail ───────── */
.detail-main{padding:0}
.backbar{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:0 30px;border-bottom:1px solid rgba(255,255,255,.045);background:rgba(8,9,13,.6)}
.crumb{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#6d7683;min-width:0}
.crumb button{display:flex;align-items:center;gap:7px;height:28px;padding:0 9px 0 7px;border-radius:7px;
  color:#98a1ae;font-size:12px;transition:.12s}
.crumb button:hover{background:#11161d;color:#fff}
.crumb .sep{color:#39414d}
.crumb b{color:#c3ccd9;font-weight:500}
.crumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-r{display:flex;align-items:center;gap:8px}
.winbtns{display:flex;gap:2px;margin-left:6px;padding-left:12px;border-left:1px solid #1a1f28}
.winbtns i{display:block;width:30px;height:28px;border-radius:6px;position:relative;color:#5d6673}
.winbtns i:hover{background:#11161d;color:#c3ccd9}

.detail-scroll{flex:1;min-height:0;overflow-y:auto;padding:22px 30px 30px}
.detail-grid{display:grid;grid-template-columns:220px minmax(0,1fr) 320px;gap:26px;align-items:start}

.d-col{min-width:0}
.d-art{width:100%;max-width:220px;aspect-ratio:1/1;border-radius:14px;overflow:hidden;position:relative;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 26px 50px -34px rgba(0,0,0,1)}
.d-art svg{width:100%;height:100%}
.d-src{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.src-badge{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:7px;width:max-content;
  border:1px solid #202a38;background:#0e131a;font-size:11.5px;color:#c3ccd9}
.src-badge .dotm{width:6px;height:6px;border-radius:4px;background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.6)}
.d-src-note{font-size:10.5px;color:#4d5764;padding-left:2px}
.d-acts{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.d-meta{margin-top:18px;border-top:1px solid rgba(255,255,255,.05);padding-top:12px;display:flex;flex-direction:column;gap:9px}
.d-meta div{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11px;color:#5d6673}
.d-meta b{color:#98a1ae;font-weight:500;font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.d-main{min-width:0}
.d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.d-title{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.01em;margin:0;color:#fff}
.d-sub{font-size:12.5px;color:#6d7683;margin-top:4px;letter-spacing:.02em}
.d-auth{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12px;color:#7d8794}
.d-auth b{color:#cfd7e2;font-weight:500}
.d-auth .vfy{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;
  background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.28);color:#9fc3fb;font-size:10px}
.d-auth .sp{width:3px;height:3px;border-radius:3px;background:#39414d}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{position:relative;border:1px solid #171d26;border-radius:9px;padding:10px 12px 11px;overflow:hidden;
  background:linear-gradient(180deg,#0d1117,#0b0e13);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.stat::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(180px 60px at 90% -20%,rgba(59,130,246,.10),transparent 70%)}
.stat .k{font-size:10px;letter-spacing:.07em;color:#5d6673;display:flex;align-items:center;gap:5px}
.stat .v{margin-top:5px;font-size:17px;font-weight:600;color:#eaf0fb;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:10.5px;font-weight:400;color:#6d7683;margin-left:3px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tagrow .tag{height:22px;font-size:10.5px;padding:0 8px}

.prose{margin-top:20px;border-top:1px solid rgba(255,255,255,.05);padding-top:16px}
.sec-h{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:13px;font-weight:600;color:#e8ebf2;letter-spacing:.01em}
.sec-h::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(180deg,var(--accent-top),var(--accent-bot))}
.sec-h .cnt{font-size:10.5px;color:#4d5764;font-weight:400;margin-left:2px}
.prose p{margin:0 0 10px;font-size:12.5px;line-height:1.8;color:#98a1ae;max-width:70ch}
.prose ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.prose li{position:relative;padding-left:18px;font-size:12.5px;color:#98a1ae;line-height:1.7}
.prose li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:2px;
  background:rgba(59,130,246,.85);box-shadow:0 0 8px rgba(59,130,246,.5)}
.prose li b{color:#dbe2ec;font-weight:500}

.gallery{margin-top:18px;border-top:1px solid rgba(255,255,255,.05);padding-top:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gtile{position:relative;aspect-ratio:16/10;border-radius:9px;overflow:hidden;border:1px solid #1c232d;cursor:pointer;
  background:#0b0e13;transition:border-color .13s,transform .13s}
.gtile svg{width:100%;height:100%}
.gtile:hover{border-color:#33415a;transform:translateY(-1px)}
.gtile .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;font-size:10.5px;color:#dbe2ec;
  background:linear-gradient(180deg,transparent,rgba(5,7,11,.9))}
.gtile .zoom{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  background:rgba(9,12,18,.72);border:1px solid rgba(255,255,255,.10);color:#c3ccd9;opacity:0;transition:.13s}
.gtile:hover .zoom{opacity:1}

.install{position:sticky;top:0;border:1px solid #1b222c;border-radius:11px;overflow:hidden;
  background:linear-gradient(180deg,#0c1016,#0a0d12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 50px -40px #000}
.inst-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px 12px;
  border-bottom:1px solid rgba(255,255,255,.05);background:linear-gradient(180deg,rgba(59,130,246,.055),transparent)}
.inst-head .t{font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center;gap:7px}
.inst-head .t svg{color:#8fb6f8}
.st{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 8px;border-radius:5px;font-size:10.5px;
  border:1px solid #232b37;background:#0e1218;color:#98a1ae}
.st .d{width:5px;height:5px;border-radius:3px;background:#5d6673}
.st.ok{color:#86efac;border-color:rgba(74,222,128,.28);background:rgba(74,222,128,.08)}
.st.ok .d{background:#4ade80;box-shadow:0 0 7px rgba(74,222,128,.8)}
.st.run{color:#9fc3fb;border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.10)}
.st.run .d{background:#60a5fa;box-shadow:0 0 7px rgba(96,165,250,.9);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.inst-body{padding:12px 14px 14px}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;letter-spacing:.07em;color:#5d6673;margin-bottom:5px;font-weight:600}
.sel{width:100%;height:34px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 10px;border-radius:7px;border:1px solid #202834;background:#0d1219;color:#dbe2ec;font-size:12px;
  transition:border-color .12s,background .12s}
.sel:hover{border-color:#2d3a4a;background:#0f151d}
.sel:focus-visible{outline:2px solid rgba(59,130,246,.8);outline-offset:2px}
.sel svg{color:#6d7683}
.vl-head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 6px;font-size:10px;
  letter-spacing:.07em;color:#4d5764;font-weight:600}
.vl{max-height:140px;overflow-y:auto;border:1px solid #191f28;border-radius:8px;background:#0a0d12;padding:3px}
.vrow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 8px;
  border-radius:6px;cursor:pointer;transition:background .1s}
.vrow:hover{background:#11161e}
.vrow .vn{font-size:11px;color:#b6bfcc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.vrow .vs{font-size:10px;color:#4d5764;font-variant-numeric:tabular-nums;flex:none}
.vrow.on{background:rgba(59,130,246,.12)}
.vrow.on .vn{color:#dbeafe}
.vrow.on .vs{color:#8fb6f8}
.vrow.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.vrow .lk{font-size:9px;color:#5d6673;border:1px solid #232a35;border-radius:3px;padding:0 4px;margin-left:4px;flex:none}
.vempty{padding:16px 8px;text-align:center;font-size:10.5px;color:#4d5764}
.dep{display:flex;gap:8px;margin-top:10px;padding:9px 10px;border-radius:7px;font-size:10.5px;line-height:1.6;
  border:1px solid #2a2519;background:rgba(245,158,11,.055);color:#b9a883}
.dep svg{color:#f59e0b;flex:none;margin-top:1px}
.dep b{display:block;color:#e3c88d;font-weight:500;font-size:11px}
.inst-actions{margin-top:12px}
.install-btn{width:100%;height:42px;font-size:13px;border-radius:9px;font-weight:500}
.inst-foot{margin-top:8px;font-size:10.5px;color:#4d5764;text-align:center;font-variant-numeric:tabular-nums}
.prog{margin-top:10px;display:none}
.prog.show{display:block}
.bar{height:4px;border-radius:3px;background:#171d26;overflow:hidden}
.bar i{display:block;height:100%;width:0%;border-radius:3px;
  background:linear-gradient(90deg,var(--accent-bot),var(--accent-top));
  box-shadow:0 0 12px rgba(59,130,246,.7);transition:width .18s linear}
.prog .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:10px;color:#6d7683}
.prog .row b{color:#bcd7ff;font-weight:500;font-variant-numeric:tabular-nums}

.similar{margin-top:26px;border-top:1px solid rgba(255,255,255,.05);padding-top:18px}
.sim-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sim-wrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.scard{flex:0 0 196px;display:flex;gap:10px;align-items:center;padding:9px;border-radius:9px;cursor:pointer;
  border:1px solid #171d26;background:linear-gradient(180deg,#0d1117,#0b0e13);transition:.13s}
.scard:hover{border-color:#2d3a4c;transform:translateY(-1px);background:linear-gradient(180deg,#10151c,#0c1016)}
.scard .art{width:38px;height:38px;flex:0 0 38px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.scard .art svg{width:100%;height:100%}
.scard .nm{min-width:0}
.scard .cn{font-size:11.5px;color:#e8ebf2;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .mt{font-size:10px;color:#5d6673;margin-top:2px;display:flex;gap:7px;font-variant-numeric:tabular-nums}
.scard .mt b{color:#98a1ae;font-weight:500}

/* ───────── floating ───────── */
.menu{position:fixed;z-index:80;min-width:170px;padding:5px;border-radius:9px;border:1px solid #242c38;
  background:#0e131a;box-shadow:0 24px 50px -20px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.05);display:none}
.menu.show{display:block;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.menu .mi{display:flex;align-items:center;gap:8px;height:30px;padding:0 9px;border-radius:6px;font-size:11.5px;color:#b6bfcc;cursor:pointer;width:100%}
.menu .mi:hover{background:#151c26;color:#fff}
.menu .mi.on{color:#dbeafe;background:rgba(59,130,246,.12)}
.menu .mi .ck{margin-left:auto;color:#60a5fa}

.toast{position:fixed;left:50%;bottom:26px;z-index:90;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:9px;height:38px;padding:0 14px;border-radius:9px;
  background:#10151d;border:1px solid #2a3546;color:#dbe2ec;font-size:11.5px;
  box-shadow:0 22px 46px -22px rgba(0,0,0,.95);transition:opacity .16s,transform .16s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#60a5fa}

@media (max-width:1279px){
  .filters{width:196px;flex-basis:196px}
  .main{padding:18px 24px 14px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero-art{width:320px}
  .hero-title{font-size:20px}
  .detail-grid{grid-template-columns:172px minmax(0,1fr) 292px;gap:20px}
  .detail-scroll{padding:18px 24px 26px}
  .backbar{padding:0 24px}
  .d-title{font-size:26px}
  .stats{gap:8px}
  .stat{padding:9px 10px 10px}
  .stat .v{font-size:16px}
}
@media (max-height:800px){
  .main{padding-top:16px;padding-bottom:10px}
  .hero{height:112px;margin-top:10px}
  .hero-title{font-size:20px}
  .hero-desc{margin-top:3px}
  .hero-meta{margin-top:6px}
  .tabsrow{height:36px;margin-top:8px}
  .grid-scroll{margin-top:9px}
  .listfoot{height:42px;margin-top:4px}
  .detail-scroll{padding-top:16px}
  .d-art{max-width:184px}
  .prose{margin-top:18px;padding-top:14px}
  .vl{max-height:150px}
}

.winbtns i:last-child:hover{background:#2a1418;color:#f87171}
.tabs-hint .sep{color:#39414d}
.fitem .cnt svg{display:inline-block;vertical-align:-2px;color:#60a5fa}
.grid.compact{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.grid.compact .card{padding:9px 10px}
.grid.compact .card .art{width:38px;height:38px;flex-basis:38px;border-radius:8px}
.grid.compact .card .by,.grid.compact .card .hr{display:none}
.grid.compact .card .cn{font-size:12px}
.grid.compact .card .en{font-size:10px}
.grid.compact .card .tags{padding-top:7px}
.grid.compact .card .top{padding-right:20px}
.grid.compact .dl-ico{width:22px;height:22px;top:7px;right:7px}
.lb{position:fixed;inset:0;z-index:120;background:rgba(4,6,10,.84);display:grid;place-items:center;animation:fade .14s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb-box{width:min(900px,88vw);border-radius:14px;overflow:hidden;border:1px solid #2a3546;background:#0b0e13;
  box-shadow:0 44px 90px -30px #000;animation:pop .16s ease-out}
.lb-art{aspect-ratio:16/9;background:#080a0e}
.lb-art svg{width:100%;height:100%}
.lb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;
  border-top:1px solid #1b222c;font-size:12px;color:#b6bfcc}
@media (max-width:1279px){
  .grid.compact{grid-template-columns:repeat(4,minmax(0,1fr))}
}


/* ═══ v2：后端约束对齐 ═══ */
.card{padding:12px 13px}
.card .art{width:54px;height:54px;flex:0 0 54px}
.card .cn{font-size:13.5px}
.card .hr{margin:9px 0 8px}
.card .meta{font-size:10.5px}

  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tags{display:flex;align-items:center;gap:5px;margin-top:auto;padding-top:9px}

.f-foot{flex:0 0 auto;padding:10px 14px 12px;border-top:1px solid rgba(255,255,255,.05);background:#090b10}

.d-src-row{display:flex;flex-wrap:wrap;gap:6px}

.d-meta .tagline{display:flex;align-items:center;gap:6px;font-size:11px;color:#7d8794}

.vt-head{height:31px;font-size:10px;letter-spacing:.05em;color:#5d6673;border-bottom:1px solid #171d26;background:#0c1016;font-weight:600}

.vt-row .num{color:#98a1ae;font-variant-numeric:tabular-nums}
.vt-row .mono{font-size:10px;color:#7d8794;font-variant-numeric:tabular-nums}
.tag.t-rel{color:#86efac;border-color:rgba(74,222,128,.25);background:rgba(74,222,128,.07)}
.tag.t-beta{color:#fcd34d;border-color:rgba(245,158,11,.28);background:rgba(245,158,11,.07)}
.vt-more{display:flex;justify-content:center;margin-top:10px}
.prose .note{margin-top:10px;font-size:10.5px;color:#4d5764;display:flex;gap:6px;align-items:flex-start;
  border-top:1px dashed #1b212b;padding-top:9px}

.st.done{color:#86efac;border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08)}

/* ═══ v3：后端事实收口 ═══ */
.d-dir{margin-top:16px;border:1px dashed #1e2530;border-radius:8px;padding:10px 11px}
.d-dir .k{font-size:9.5px;letter-spacing:.08em;color:#4d5764;font-weight:600}
.d-dir .p{margin:4px 0 8px;font-size:10.5px;color:#98a1ae;font-family:Consolas,"Microsoft YaHei UI",monospace;

.d-dir .btn{height:26px;font-size:10.5px}

var S = { cat:"mod", q:"", loader:"", ver:"", env:"", lic:"", sort:"dl", page:1, cur:null, inst:"idle", mc:"", loaderSel:"", expanded:false };
var PAGE = 12;
var $ = function(id){ return document.getElementById(id); };
function byId(id){ for (var i=0;i<D.length;i++) if (D[i].id===id) return D[i]; return null; }
function catOf(id){ for (var i=0;i<CATS.length;i++) if (CATS[i].id===id) return CATS[i]; return CATS[0]; }
function rgba(hex,a){
  var n = parseInt(hex.replace("#",""), 16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
}
function pad(n){ return n<10 ? "0"+n : ""+n; }
function splitSize(s){
  var m = String(s).match(/^([\d.]+)\s*(.*)$/);
  return m ? [m[1], m[2]] : [s, ""];
}
function shrink(size, i){
  var sp = splitSize(size);
  var v = parseFloat(sp[0]);
  if (isNaN(v)) return size;
  if (i === 0) return size;
  var nv = v * (1 - i * 0.045);
  return (nv >= 100 ? nv.toFixed(0) : nv.toFixed(nv < 10 ? 1 : 0)) + " " + sp[1];
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function clientOf(it){ return CLIENT_MAP[it.id] || "双端"; }
function sourceLocked(){
  if (S.cat === "shader" || S.cat === "pack") return !!S.ver;
  if (S.cat === "mod") return !!(S.lic || S.env);
  return false;
}
function fmtDl(n){
  if (n >= 1e6) return (n/1e6).toFixed(1) + "M";
  if (n >= 1e3) return Math.round(n/1e3) + "K";
  return "" + n;
}
function pageSize(){
  var cols = window.innerWidth >= 1280 ? 4 : 3;
  var rows = window.innerHeight >= 820 ? 3 : 2;
  return cols * rows;
}
function filtered(){
  var q = S.q.trim().toLowerCase();
  var lock = sourceLocked();
  var out = D.filter(function(it){
    if (S.cat !== "all" && it.cat !== S.cat) return false;
    if (lock && it.src !== "Modrinth") return false;
    if (S.loader && it.loaders.indexOf(S.loader) < 0) return false;
    if (S.ver && it.vers.indexOf(S.ver) < 0) return false;
    if (S.cat === "mod" && S.env){
      var c = clientOf(it);
      if (S.env === "客户端" && c === "服务端") return false;
      if (S.env === "服务端" && c === "客户端") return false;
    }
    if (S.cat === "mod" && S.lic && it.lic !== S.lic) return false;
    if (q){
      var hay = (it.cn + " " + it.en + " " + it.desc + " " + it.tags.join(" ") + " " + it.loaders.join(" ") + " " + it.vers.join(" ")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  out.sort(function(a,b){
    if (S.sort === "dl") return b.dl - a.dl;
    if (S.sort === "updated") return a.ts - b.ts;
    return a.en.localeCompare(b.en);
  });
  return out;
}
var SORT_LABEL = { dl:"下载量", updated:"最近更新", name:"名称" };
var LOADER_ORDER = ["Fabric","NeoForge","Forge","Quilt","Iris","OptiFine","原版"];
var VER_LIST = ["1.21.4","1.21.1","1.20.6","1.20.1","1.19.2","1.18.2","1.12.2"];

/* ══════════ 左栏筛选 ══════════ */
function syncRailMask(){
  var el = $("filterScroll");
  if (!el) return;
  el.classList.toggle("masked", el.scrollHeight > el.clientHeight + 2);
}
function renderFilters(){
  var scope = itemsOfCat(S.cat);
  var showLoader = (S.cat === "mod" || S.cat === "modpack");
  var showEnv = S.cat === "mod";
  var showLic = S.cat === "mod";
  var showSort = S.cat === "data";
  var loaders = [];
  if (showLoader){
    LOADER_ORDER.forEach(function(l){
      for (var i=0;i<scope.length;i++) if (scope[i].loaders.indexOf(l) >= 0){ loaders.push(l); break; }
    });
  }
  var vers = VER_LIST.filter(function(v){
    for (var i=0;i<scope.length;i++) if (scope[i].vers.indexOf(v) >= 0) return true;
    return false;
  });
  var lics = [];
  if (showLic) scope.forEach(function(x){ if (lics.indexOf(x.lic) < 0) lics.push(x.lic); });

  var h = "";
  h += '<div class="fgroup"><div class="fg-title">分类 <em>CATEGORY</em></div>';
  CATS.forEach(function(c){
    var n = c.id === "all" ? D.length : itemsOfCat(c.id).length;
    h += '<div class="fitem' + (S.cat === c.id ? " on" : "") + '" data-cat="' + c.id + '" role="button" tabindex="0">'
       + ico(c.icon,"s13") + '<span>' + (c.id === "all" ? "全部资源" : c.label) + '</span>'
       + '<span class="cnt num">' + n + '</span></div>';
  });
  h += '</div>';

  if (showLoader){
    h += '<div class="fgroup"><div class="fg-title">加载器 <em>LOADER</em></div><div class="chips">';
    h += '<button class="chip' + (S.loader === "" ? " on" : "") + '" data-loader="">不限</button>';
    loaders.forEach(function(l){
      h += '<button class="chip' + (S.loader === l ? " on" : "") + '" data-loader="' + l + '">' + l + '</button>';
    });
    h += '</div></div>';
  }

  h += '<div class="fgroup"><div class="fg-title">游戏版本 <em>VERSION</em></div><div class="chips">';
  h += '<button class="chip' + (S.ver === "" ? " on" : "") + '" data-ver="">全部</button>';
  vers.forEach(function(v){
    h += '<button class="chip' + (S.ver === v ? " on" : "") + '" data-ver="' + v + '">' + v + '</button>';
  });
  h += '</div></div>';

  if (showEnv){
    h += '<div class="fgroup"><div class="fg-title">运行环境 <em>CLIENT SIDE</em></div><div class="chips">';
    ["不限","客户端","服务端"].forEach(function(v){
      h += '<button class="chip' + ((S.env || "不限") === v ? " on" : "") + '" data-env="' + (v === "不限" ? "" : v) + '">' + v + '</button>';
    });
    h += '</div></div>';
  }
  if (showLic){
    h += '<div class="fgroup"><div class="fg-title">许可 <em>LICENSE</em></div><div class="chips">';
    h += '<button class="chip' + (S.lic === "" ? " on" : "") + '" data-lic="">不限</button>';
    lics.forEach(function(v){
      h += '<button class="chip' + (S.lic === v ? " on" : "") + '" data-lic="' + v + '">' + v + '</button>';
    });
    h += '</div></div>';
  }
  if (showSort){
    h += '<div class="fgroup"><div class="fg-title">排序 <em>SORT</em></div>';
    [["dl","下载量最高"],["updated","最近更新"],["name","名称 A–Z"]].forEach(function(s){
      var on = S.sort === s[0];
      h += '<div class="fitem' + (on ? " on" : "") + '" data-sort="' + s[0] + '" role="button" tabindex="0">'
         + (s[0] === "dl" ? ico("trending-up","s13") : s[0] === "updated" ? ico("clock","s13") : ico("list","s13"))
         + '<span>' + s[1] + '</span>'
         + (on ? '<span class="cnt">' + ico("check","s12") + '</span>' : '') + '</div>';
    });
    h += '</div>';
  }

  var note = {
    mod: "选择「运行环境」或「许可」后，结果将只保留 Modrinth 来源。",
    shader: "应用任一筛选后，仅返回 Modrinth 来源的光影。",
    pack: "应用任一筛选后，仅返回 Modrinth 来源的资源包。",
    modpack: "整合包同时来自 Modrinth 与 CurseForge，不做来源过滤。",
    data: "数据包支持按下载量、更新时间与名称排序。",
    all: "共 " + D.length + " 项资源，来自 Modrinth 与 CurseForge 两个来源。"
  }[S.cat];
  h += '<div class="f-note">' + note + '</div>';
  $("filterScroll").innerHTML = h;

  var lock = sourceLocked();
  syncRailMask();
  $("fFoot").innerHTML = '<div class="f-src"><span class="dots">'
    + '<i></i><i class="' + (lock ? "off" : "cf") + '"></i></span>'
    + '<span>' + (lock ? '<b>仅 Modrinth</b><br>已按筛选条件跳过 CurseForge 来源' : '<b>Modrinth · CurseForge</b><br>两种来源的结果都会展示') + '</span></div>';
}

function renderHint(){
  var bits = [];
  if (S.loader) bits.push("<b>" + S.loader + "</b>");
  if (S.ver) bits.push("<b>" + S.ver + "</b>");
  if (S.env) bits.push("<b>" + S.env + "</b>");
  if (S.lic) bits.push("<b>" + S.lic + "</b>");
  if (S.q.trim()) bits.push("“<b>" + esc(S.q.trim()) + "</b>”");
  var cat = S.cat === "all" ? "全部资源" : catOf(S.cat).label;
  var lock = sourceLocked() ? '<span class="sep">·</span><span>仅 Modrinth</span>' : "";

    ? '<span>已筛选</span>' + bits.join('<span class="sep"> · </span>') + lock
    : '<span>' + cat + '</span><span class="sep">·</span><span>按</span><b>' + SORT_LABEL[S.sort] + '</b><span>排序</span>' + lock;
}

function renderState(kind){
  $("sortSeg").style.display = (S.cat === "data") ? "" : "none";
  if (kind === "loading"){
    $("stateBlock").style.display = "none";
    $("grid").style.display = "";
    $("hero").style.display = "";
    $("hero").style.setProperty("--hero-glow", "rgba(59,130,246,.10)");
    $("hero").classList.add("sk");
    $("hero").innerHTML = '<div style="padding:0 24px">'
      + '<div class="sk-bar" style="width:120px;height:10px"></div>'
      + '<div class="sk-bar" style="width:230px;height:22px;margin-top:14px"></div>'
      + '<div class="sk-bar" style="width:400px;height:11px;margin-top:12px"></div>'
      + '<div class="sk-bar" style="width:290px;height:11px;margin-top:9px"></div></div>';
    var n = pageSize();
    $("grid").innerHTML = new Array(n).fill(0).map(skCard).join("");
    $("empty").style.display = "none";
    $("count").textContent = "—";
    $("footInfo").innerHTML = "正在从 Modrinth 与 CurseForge 拉取列表…";
    $("pager").innerHTML = "";
    $("loadMore").disabled = true;
    $("loadMore").lastChild.nodeValue = "加载中";
    $("filterHint").innerHTML = '<span>连接资源站</span><span class="sep">·</span><span>请稍候</span>';
    return;
  }
  if (kind === "timeout"){
    $("hero").classList.remove("sk");
    $("grid").style.display = "none";
    $("empty").style.display = "none";
    $("hero").style.display = "none";
    var el = $("stateBlock");
    el.style.display = "flex";
    el.innerHTML = '<div class="state-ic">' + ico("alert-triangle","s22") + '</div>'
      + '<h4>请求超时</h4>'
      + '<p>9 秒内没有收到 Modrinth / CurseForge 的响应。可能是网络受限，或资源站暂时不可用。</p>'
      + '<div class="state-acts"><button class="btn primary sm" id="retryBtn">' + ico("refresh","s13") + '重试</button>'
      + '<button class="btn sm ghost" id="openSiteBtn">' + ico("external","s13") + '打开资源站</button></div>'
      + '<div class="state-foot">后端不会返回 failed 信号 · 超时由 UI 侧 9s 兜底</div>';
    $("count").textContent = "—";
    $("footInfo").innerHTML = "未能连接到资源站";
    $("pager").innerHTML = "";
    $("loadMore").disabled = true;
    $("loadMore").lastChild.nodeValue = "不可用";
    $("filterHint").innerHTML = '<span>连接失败</span><span class="sep">·</span><span>9s 超时</span>';
  }
}

function renderGrid(){
  if (FORCE_STATE){ renderState(FORCE_STATE); return; }
  var list = filtered();
  var size = pageSize();
  var pages = Math.max(1, Math.ceil(list.length / size));
  if (S.page > pages) S.page = pages;
  var slice = list.slice((S.page-1)*size, S.page*size);

  $("grid").innerHTML = slice.map(cardHTML).join("");
  $("empty").style.display = list.length ? "none" : "block";
  $("gridScroll").scrollTop = 0;
  $("count").textContent = list.length;

  var shown = slice.length;
  $("footInfo").innerHTML = '显示 <b class="num">' + shown + '</b> / <b class="num">' + list.length + '</b> 项 · 第 <b class="num">' + S.page + '</b> / ' + pages + ' 页';

  var ph = '<button data-pg="prev" ' + (S.page<=1?"disabled":"") + ' aria-label="上一页">' + ico("chevron-left","s13") + '</button>';
  for (var i=1;i<=pages;i++){
    if (pages > 6 && i > 3 && i < pages - 1){ if (i === 4) ph += '<button disabled>…</button>'; continue; }
    ph += '<button data-pg="' + i + '" class="' + (i===S.page?"on":"") + '">' + i + '</button>';
  }
  ph += '<button data-pg="next" ' + (S.page>=pages?"disabled":"") + '" aria-label="下一页">' + ico("chevron-right","s13") + '</button>';
  $("pager").innerHTML = ph;

  var lm = $("loadMore");
  lm.disabled = S.page >= pages;
  lm.lastChild.nodeValue = S.page >= pages ? "已全部加载" : "加载更多";

  $("sortSeg").style.display = (S.cat === "data") ? "" : "none";
  renderHero(list);
  renderHint();
  syncSortSeg();
  syncChips();
}

function versionRows(it){
  var out = [];
  var fname = it.en.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  it.vers.forEach(function(mc, mi){
    it.loaders.forEach(function(ld){
      var slug = ld.toLowerCase().replace(/[^a-z0-9]+/g,"");
      var name = slug ? (fname + "-" + slug + "-" + (it.mv[mi] || "1.0.0")) : (fname + "-" + (it.mv[mi] || "1.0.0"));
      var factor = Math.max(0.18, 0.62 - mi * 0.13);
      out.push({
        id: name + "@" + mc + "@" + ld,
        name: name, mc: mc, ld: ld, size: shrink(it.size, mi), date: it.dates[mi],
        type: mi === 1 ? "Beta" : "Release",
        dls: Math.round(it.dl * factor)
      });
    });
  });
  return out;
}
function currentRow(){
  if (!S.cur) return null;
  var rows = versionRows(S.cur);
  for (var i=0;i<rows.length;i++) if (rows[i].id === S.selV) return rows[i];
  return rows[0] || null;
}

function similarHTML(it){
  var pool = D.filter(function(x){ return x.cat === it.cat && x.id !== it.id; });
  pool.sort(function(a,b){ return b.dl - a.dl; });
  return pool.slice(0,6).map(function(x){
    return '<div class="scard" data-id="' + x.id + '">'
      + '<div class="art">' + art(x) + '</div>'
      + '<div class="nm"><div class="cn">' + x.cn + '</div>'
      + '<div class="mt"><span class="num">' + ico("download","s11") + x.dlT + '</span>'
      + '<span class="num">' + x.up + '</span></div></div></div>';
  }).join("");
}

function fillVersionList(){
  var el = $("vl");
  if (!el || !S.cur) return;
  var rows = versionRows(S.cur);
  if (!S.selV){
    var pick = rows[0];
    for (var i=0;i<rows.length;i++) if (rows[i].mc === S.mc && rows[i].ld === S.loaderSel){ pick = rows[i]; break; }
    S.selV = pick ? pick.id : "";
  }
  el.innerHTML = rows.map(function(r){
    return '<div class="vrow' + (r.id === S.selV ? " on" : "") + '" data-v="' + r.id + '" role="button" tabindex="0">'
      + '<span class="vn">' + (r.name || r.id) + '</span><span class="vs num">' + r.size + '</span></div>';
  }).join("");
}

function updateInstallUI(){
  var st = $("instState"), btn = $("installBtn"), prog = $("prog"), foot = $("instFoot");
  if (!st || !btn || !foot || !S.cur) return;
  var row = currentRow();
  if (S.inst === "running"){
    st.className = "st run"; st.innerHTML = '<span class="d"></span>下载中';
    btn.disabled = true; btn.innerHTML = '<span>正在安装…</span>';
    prog.classList.add("show");
  } else if (S.inst === "done"){
    st.className = "st done"; st.innerHTML = '<span class="d"></span>下载完成';
    btn.disabled = false; btn.innerHTML = ico("refresh","s15") + '<span>重新下载</span>';
    prog.classList.remove("show");
    foot.textContent = "已完成 " + (row ? row.id : "") + " 的下载与校验";
  } else if (S.inst === "failed"){
    st.className = "st bad"; st.innerHTML = '<span class="d"></span>安装失败';
    btn.disabled = false; btn.innerHTML = ico("refresh","s15") + '<span>重试</span>';
    prog.classList.remove("show");
    foot.textContent = "连接超时 · 校验未通过，可重试";
  } else {
    st.className = "st"; st.innerHTML = '<span class="d"></span>未安装';
    btn.disabled = false; btn.innerHTML = ico("download","s15") + '<span>下载并安装</span>';
    prog.classList.remove("show");
    foot.textContent = (row ? row.name + " · " + row.size : S.cur.size);
  }
}

function refreshVersionPane(){
  fillVersionList();
  updateInstallUI();
  var m = $("selMc"), l = $("selLoader");
  if (m) m.firstElementChild.textContent = S.mc;
  if (l) l.firstElementChild.textContent = S.loaderSel;
}

/* ══════════ 浮层 ══════════ */
var toastTimer = null;
function toast(msg, icon){
  var t = $("toast");
  t.innerHTML = ico(icon || "check","s14") + '<span>' + msg + '</span>';
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function closeMenu(){ var m = $("menu"); m.classList.remove("show"); m.innerHTML = ""; }
function openMenu(anchor, items, current, onPick){
  var m = $("menu");
  m.innerHTML = items.map(function(it){
    return '<button class="mi' + (it.value === current ? " on" : "") + '" data-val="' + it.value + '">'
      + it.label + (it.value === current ? '<span class="ck">' + ico("check","s12") + '</span>' : '') + '</button>';
  }).join("");
  m.classList.add("show");
  var r = anchor.getBoundingClientRect();
  m.style.minWidth = Math.max(r.width, 168) + "px";
  m.style.left = Math.round(Math.min(r.left, window.innerWidth - m.offsetWidth - 12)) + "px";
  var top = r.bottom + 6;
  if (top + m.offsetHeight > window.innerHeight - 10) top = r.top - m.offsetHeight - 6;
  m.style.top = Math.round(top) + "px";
  m.onclick = function(e){
    var b = e.target.closest(".mi");
    if (!b) return;
    closeMenu();
    onPick(b.getAttribute("data-val"));
  };
}
function openLightbox(it, i){
  var caps = GAL_CAP[it.cat] || GAL_CAP.mod;
  var ov = document.createElement("div");
  ov.className = "lb";
  ov.innerHTML = '<div class="lb-box"><div class="lb-art">' + shotArt(it, i) + '</div>'
    + '<div class="lb-bar"><span>' + it.cn + ' · ' + caps[i] + '</span>'
    + '<button class="btn sm" id="lbClose">' + ico("x","s13") + '关闭</button></div></div>';
  ov.addEventListener("click", function(e){
    if (e.target === ov || e.target.closest("#lbClose")) ov.remove();
  });
  document.body.appendChild(ov);
}

/* ══════════ 视图切换 ══════════ */
function showView(n){
  $("viewList").classList.toggle("active", n === "list");
  $("viewDetail").classList.toggle("active", n === "detail");
}
function openDetail(id, push){
  var it = byId(id);
  if (!it) return;
  if (S.cur && S.cur.id === it.id && $("viewDetail").classList.contains("active")) return;
  if (S.inst === "installing") clearInterval(S.timer);
  S.cur = it; S.inst = "idle"; S.mc = it.vers[0]; S.loaderSel = it.loaders[0]; S.selV = ""; S.expanded = false;
  renderDetail();
  showView("detail");
  $("detailScroll").scrollTop = 0;
  if (push && location.hash !== "#/r/" + id) location.hash = "#/r/" + id;
}
function backToList(){
  if (location.hash && location.hash !== "#/") location.hash = "#/";
  else showView("list");
  showView("list");
}
function route(){
  var m = (location.hash || "").match(/^#\/r\/(.+)$/);
  if (m){
    var it = byId(decodeURIComponent(m[1]));
    if (it){ openDetail(it.id, false); return; }
  }
  showView("list");
}

/* ══════════ 安装流程 ══════════ */
function startInstall(){
  if (S.inst === "running") return;
  var row = currentRow();
  if (!row) return;
  S.inst = "running";
  updateInstallUI();
  var pct = 0;
  var willFail = location.search.indexOf("fail") >= 0;
  clearInterval(S.timer);
  S.timer = setInterval(function(){
    pct += Math.random() * 6.4 + 2.4;
    if (pct > 100) pct = 100;
    if (willFail && pct > 74) pct = 74;
    var f = $("barFill"), pl = $("progPct"), lb = $("progLabel");
    if (!f || !pl || !lb){ clearInterval(S.timer); return; }
    f.style.width = pct.toFixed(1) + "%";
    pl.textContent = Math.round(pct) + "%";
    lb.textContent = pct < 56 ? "正在下载 " + row.id
      : (pct < 88 ? "正在写入 .minecraft/" + (S.cur.cat === "shader" ? "shaderpacks" : S.cur.cat === "pack" ? "resourcepacks" : S.cur.cat === "modpack" ? "instances" : "mods")
      : "正在校验文件签名");
    if (willFail && pct >= 74){
      clearInterval(S.timer);
      S.inst = "failed";
      updateInstallUI();
      toast("安装失败 · 连接超时", "alert-triangle");
      return;
    }
    if (pct >= 100){
      clearInterval(S.timer);
      S.inst = "done";
      updateInstallUI();
      toast("下载完成 · 已校验 " + S.cur.cn, "check");
    }
  }, 80);
}

/* ══════════ 列表交互 ══════════ */
function setCat(id){
  S.cat = id;
  S.page = 1;
  S.expanded = false;
  var scope = itemsOfCat(id);
  var ok = false;
  for (var i=0;i<scope.length;i++) if (scope[i].loaders.indexOf(S.loader) >= 0) ok = true;
  if (!ok) S.loader = "";
  if (id !== "mod"){ S.env = ""; S.lic = ""; }
  if (id !== "data") S.sort = "dl";
  renderFilters();
  renderTabs();
  renderGrid();
}
function resetFilters(){
  S.loader = ""; S.ver = ""; S.env = ""; S.lic = ""; S.q = ""; S.page = 1;
  if (S.cat !== "data") S.sort = "dl";
  $("q").value = "";
  renderFilters();
  renderGrid();
}

function bindList(){
  $("q").addEventListener("input", function(e){ S.q = e.target.value; S.page = 1; renderGrid(); });
  $("resetFilters").addEventListener("click", resetFilters);
  $("emptyReset").addEventListener("click", resetFilters);
  $("emptyAllBtn").addEventListener("click", function(){ setCat("all"); });
  $("stateBlock").addEventListener("click", function(e){
    if (e.target.closest("#retryBtn")){ location.reload(); }
    if (e.target.closest("#openSiteBtn")) toast("已在浏览器中打开 modrinth.com", "external");
  });

  $("tabs").addEventListener("click", function(e){
    var b = e.target.closest("[data-cat]");
    if (b) setCat(b.getAttribute("data-cat"));
  });

  $("filterScroll").addEventListener("click", function(e){
    var el = e.target.closest("[data-cat],[data-loader],[data-ver],[data-env],[data-lic],[data-sort]");
    if (!el) return;
    if (el.hasAttribute("data-cat")){ setCat(el.getAttribute("data-cat")); return; }
    if (el.hasAttribute("data-loader")) S.loader = el.getAttribute("data-loader");
    else if (el.hasAttribute("data-ver")) S.ver = el.getAttribute("data-ver");
    else if (el.hasAttribute("data-env")) S.env = el.getAttribute("data-env");
    else if (el.hasAttribute("data-lic")) S.lic = el.getAttribute("data-lic");
    else S.sort = el.getAttribute("data-sort");
    S.page = 1;
    renderFilters();
    renderGrid();
  });

  $("sortSeg").addEventListener("click", function(e){
    var b = e.target.closest("[data-sort]");
    if (!b) return;
    S.sort = b.getAttribute("data-sort");
    S.page = 1;
    renderFilters();
    renderGrid();
  });

  $("grid").addEventListener("click", function(e){
    var dl = e.target.closest("[data-dl]");
    if (dl){
      e.stopPropagation();
      toast("已加入下载队列 · " + byId(dl.getAttribute("data-dl")).cn, "download");
      return;
    }
    var card = e.target.closest(".card");
    if (card) openDetail(card.getAttribute("data-id"), true);
  });
  $("grid").addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    var card = e.target.closest(".card");
    if (card){ e.preventDefault(); openDetail(card.getAttribute("data-id"), true); }
  });

  $("pager").addEventListener("click", function(e){
    var b = e.target.closest("[data-pg]");
    if (!b || b.disabled) return;
    var v = b.getAttribute("data-pg");
    if (v === "prev") S.page = Math.max(1, S.page - 1);
    else if (v === "next") S.page = S.page + 1;
    else S.page = parseInt(v, 10);
    renderGrid();
  });

  $("loadMore").addEventListener("click", function(){
    var pages = Math.max(1, Math.ceil(filtered().length / pageSize()));
    if (S.page >= pages){ toast("已经是全部结果了", "check"); return; }
    S.page += 1;
    renderGrid();
    $("gridScroll").scrollTop = 0;
  });

  $("hero").addEventListener("click", function(){
    if (this.getAttribute("data-id")) openDetail(this.getAttribute("data-id"), true);
  });
  $("hero").addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); this.click(); }
  });

  var vt = document.querySelectorAll(".viewtog button");
  vt[0].addEventListener("click", function(){
    $("grid").classList.remove("compact");
    vt[0].classList.add("on"); vt[1].classList.remove("on");
  });
  vt[1].addEventListener("click", function(){
    $("grid").classList.add("compact");
    vt[1].classList.add("on"); vt[0].classList.remove("on");
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "/" && document.activeElement !== $("q")){
      e.preventDefault(); $("q").focus();
    } else if (e.key === "Escape"){
      closeMenu();
      if (document.activeElement === $("q")) $("q").blur();
    }
  });
  document.addEventListener("click", function(e){
    if (!e.target.closest("#menu") && !e.target.closest(".sel")) closeMenu();
  });

  var rt = null;
  window.addEventListener("resize", function(){
    closeMenu();
    clearTimeout(rt);
    rt = setTimeout(function(){ renderGrid(); }, 120);
  });
  window.addEventListener("hashchange", route);
}

/* ══════════ 详情交互（事件委托，只绑一次）══════════ */
function bindDetail(){
  $("backbar").addEventListener("click", function(e){
    if (e.target.closest("#backBtn")) backToList();
  });

  $("detailScroll").addEventListener("click", function(e){
    if (!S.cur) return;
    if (e.target.closest("#copyBtn")){ toast("已复制 " + S.cur.src + " 链接", "copy"); return; }
    if (e.target.closest("#openBtn")){ toast("已在浏览器中打开 " + S.cur.src + " 页面", "external"); return; }
    if (e.target.closest("#openDir")){ toast("已打开 " + (DIRS[S.cur.cat] || ""), "folder"); return; }
    if (e.target.closest("#installBtn")){ startInstall(); return; }
    if (e.target.closest("#vtMore")){ S.expanded = !S.expanded; renderDetail(); return; }
    var dp = e.target.closest(".dep-row");
    if (dp){ toast("依赖 " + dp.querySelector(".dep-nm").textContent + " · 版本约束待后端", "package"); return; }

    var mc = e.target.closest("#selMc");
    if (mc){
      openMenu(mc, S.cur.vers.map(function(v){ return { value:v, label:v }; }), S.mc, function(v){
        S.mc = v; S.selV = ""; refreshVersionPane();
      });
      return;
    }
    var ld = e.target.closest("#selLoader");
    if (ld){
      openMenu(ld, S.cur.loaders.map(function(v){ return { value:v, label:v }; }), S.loaderSel, function(v){
        S.loaderSel = v; S.selV = ""; refreshVersionPane();
      });
      return;
    }
    var vr = e.target.closest(".vrow");
    if (vr){
      S.selV = vr.getAttribute("data-v");
      var rows = $("vl").querySelectorAll(".vrow");
      for (var i=0;i<rows.length;i++) rows[i].classList.toggle("on", rows[i] === vr);
      updateInstallUI();
      return;
    }
    var sc = e.target.closest(".scard");
    if (sc){ openDetail(sc.getAttribute("data-id"), true); return; }

    if (e.target.closest("#simAll")){
      S.cat = S.cur.cat; S.page = 1;
      renderFilters(); renderTabs(); renderGrid();
      backToList();
    }
  });
}
