<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>版本设置 · 快捷入口</title>
<style>
:root{--bg:#08090d;--sidebar:#0a0b0f;--card:#0b0d12;--line:#14171d;--line2:#262b35;
  --fg:#e8ebf2;--fg2:#98a1ae;--fg3:#5d6673;--accent:#3b82f6;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05060a}
body{font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;color:var(--fg);font-size:12px;
  display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:10px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.i{width:1em;height:1em;flex:0 0 auto;display:block}

.win{width:1100px;height:720px;background:var(--bg);position:relative;overflow:hidden;flex:0 0 auto}
.top{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--line)}
.back{height:32px;border:1px solid var(--line2);border-radius:2px;display:inline-flex;align-items:center;gap:7px;
  padding:0 12px;color:var(--fg2);font-size:12px;margin-left:24px;
  transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease)}
.back .i{width:14px;height:14px}
.back:hover{background:#11151c;border-color:#39414f;color:var(--fg)}
.tt1{font-size:15px;font-weight:600;color:#fff;margin-left:14px}
.tt2{font-size:11px;color:var(--fg3);margin-left:12px;font-family:ui-monospace,Consolas,monospace}
.body{position:absolute;left:0;right:0;top:56px;bottom:0;display:flex}

.nav{width:208px;flex:0 0 208px;background:var(--sidebar);border-right:1px solid var(--line);
  position:relative;padding:12px 10px;overflow:hidden}
.m-label{font-size:10px;color:#3f4753;letter-spacing:.11em;padding:14px 10px 5px}
.m-label:first-child{display:none}
.m-item{display:flex;align-items:center;gap:9px;width:100%;height:40px;padding:0 10px;border-radius:6px;
  color:var(--fg2);font-size:12.5px;transition:background .12s var(--ease),color .12s var(--ease)}
.m-item .i{width:15px;height:15px;color:#4d5666;transition:color .12s var(--ease)}
.m-item:hover{background:#0f131a;color:var(--fg)}
.m-item:hover .i{color:var(--fg2)}
.m-item.on{color:#fff}
.m-item.on .i{color:#7fa9f5}
.bar{position:absolute;left:2px;width:2px;height:22px;border-radius:2px;background:var(--accent);
  box-shadow:0 0 10px 1px rgba(59,130,246,.5);opacity:0;pointer-events:none;
  transition:transform .18s var(--ease),opacity .12s var(--ease)}

.main{flex:1;min-width:0;padding:20px 24px;overflow:hidden}
.swap{animation:swapIn .18s var(--ease)}
@keyframes swapIn{from{opacity:.82;transform:translateY(6px)}to{opacity:1;transform:none}}
.hd{font-size:13px;font-weight:600;margin-bottom:14px}
.ph{color:var(--fg3);font-size:12px;padding:32px 0}
.pn{display:none}
.vp.on{display:block}
.vo.on{display:block}
.ov{display:flex;flex-direction:column;gap:2px;max-width:520px}
.ov .kv{display:flex;align-items:baseline;gap:12px;padding:9px 2px;border-bottom:1px solid #13161d;font-size:12px}
.ov .kv .k{color:var(--fg3);width:76px;flex:0 0 76px;font-size:11.5px}
.ov .kv .v{color:#cfd6e1}
.ov .ph{margin-top:18px;padding:0}

/* 分组标签 */
.gl,.gt{font-size:10px;color:#4b5460;letter-spacing:.1em}

/* A：分组瓦片 */
.va.on{display:flex;flex-direction:column;height:100%;gap:12px}
.agrp{flex:1;min-height:0;display:flex;gap:14px}
.agrp .gl{width:54px;flex:0 0 54px;padding-top:3px}
.atiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1;min-width:0}
.tile{border:1px solid var(--line2);border-radius:10px;background:var(--card);color:#dfe5ee;font-size:12.5px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:10px;
  transition:border-color .12s var(--ease),background .12s var(--ease),transform .12s var(--ease)}
.tile .i{width:18px;height:18px;color:#7f8b9c;transition:color .12s var(--ease)}
.tile:hover{border-color:#3a4557;background:#0f1319}
.tile:hover .i{color:#9db8e8}
.tile:active{transform:scale(.995)}

/* 通用行 */
.rrow{display:flex;align-items:center;gap:11px;flex:1;min-height:40px;padding:0 14px;color:var(--fg2);font-size:12.5px;
  transition:background .12s var(--ease)}
.rrow .i{width:15px;height:15px;color:#4d5666;transition:color .12s var(--ease)}
.rrow .rt{color:#cfd6e1}
.rrow .rs{margin-left:auto;font-size:10px;color:#3f4753;font-family:ui-monospace,Consolas,monospace}
.rrow .ra{margin-left:auto;font-size:10.5px;color:#3f4753;transition:color .12s var(--ease)}
.rrow:hover{background:#11151c}
.rrow:hover .i{color:var(--fg2)}
.rrow:hover .ra{color:#7fa9f5}
.rrow.warn .i{color:#8a6a3a}
.rrow.warn .ra{color:#8a6a3a}
.rrow.warn .rs{color:#8a6a3a}
.b-list.plain{border:0;background:none;border-radius:0}
.b-list.plain>.b-grp>.gt{padding-left:2px}
.b-list.plain .rrow{padding:0 6px}
.b-list.plain .icb{width:30px;height:30px;border-radius:8px;background:#101620;display:grid;place-items:center;
  color:#6f7d90;flex:0 0 auto;transition:background .12s var(--ease),color .12s var(--ease)}
.b-list.plain .icb .i{width:15px;height:15px}
.b-list.plain .rrow:hover .icb{background:#16202f;color:#9db8e8}
.b-list.plain .rrow:hover{background:none}
.b-list.plain .rrow:hover .rt{color:#fff}
.b-list.plain .rrow+.rrow,.b-list.plain .gt+.rrow{border-top:1px solid #13161d}

/* 分组内行：组标题 + 行 */
.b-grp{display:flex;flex-direction:column;flex:1;min-height:0}
.b-grp>.gt{padding:10px 14px 2px;flex:0 0 auto}
.b-grp+.b-grp{border-top:1px solid #10131a}

/* B：列表 + 右侧信息 */
.vb.on{display:flex;flex-direction:column;height:100%}
.vc.on{display:flex;flex-direction:column;height:100%}

.b-list{flex:1;min-width:0;border:1px solid var(--line2);border-radius:10px;background:var(--card);
  overflow:hidden;display:flex;flex-direction:column}







/* C：整宽分组列表 */
.vc.on{display:flex;flex-direction:column;height:100%}




.tools{width:1100px;display:flex;align-items:center;gap:8px;color:#5d6673;font-size:11px}
.tools b{color:#98a1ae;font-weight:500}
.tools .sp{flex:1}
.tools button{height:24px;padding:0 10px;border-radius:6px;border:1px solid #262b35;color:#98a1ae;font-size:11px}
.tools button.on{background:#132340;border-color:#2c4a7a;color:#a9c8ff}
</style></head>

<div class="tools">
  <b>方案</b>
  <button class="on" data-v="a">A 分组瓦片</button>
  <button data-v="b">B 卡片列表</button>
  <button data-v="c">C 轻量列表</button>
  <span class="sp"></span>
  <span>数字键 1-8 切左栏分区</span>
</div>

<script>
let scheme = 'a';
const bar = document.getElementById('bar'), main = document.getElementById('main');
let cur = null;
function moveBar(el, animate){
  if (!el) { bar.style.opacity = 0; return; }
  const top = el.offsetTop + (el.offsetHeight - 22) / 2;
  if (!animate) bar.style.transition = 'none';
  bar.style.opacity = 1;
  bar.style.transform = 'translateY(' + top + 'px)';
  if (!animate) { void bar.offsetWidth; bar.style.transition = ''; }
}
function show(sel){
  document.querySelectorAll('.va,.vb,.vc,.vp,.vo').forEach(p => p.classList.remove('on'));
  document.querySelector(sel).classList.add('on');
}
function selectSection(el){
  cur = el;
  document.querySelectorAll('.m-item').forEach(x => x.classList.toggle('on', x === el));
  moveBar(el, true);
  if (el.dataset.k === '快捷入口') show('.v' + scheme);
  else if (el.dataset.k === '概览') show('.vo');
  else { document.getElementById('pTitle').textContent = el.dataset.k; show('.vp'); }
  main.classList.remove('swap'); void main.offsetWidth; main.classList.add('swap');
}
function selectScheme(s){
  scheme = s;
  document.querySelectorAll('.tools button').forEach(b => b.classList.toggle('on', b.dataset.v === s));
  selectSection(document.querySelector('.m-item[data-k="快捷入口"]'));
}
document.querySelectorAll('.m-item').forEach(el => el.addEventListener('click', () => selectSection(el)));
document.querySelectorAll('.tools button').forEach(b => b.addEventListener('click', () => selectScheme(b.dataset.v)));
const q = new URLSearchParams(location.search);
if (q.get('v')) selectScheme(q.get('v'));
selectSection(document.querySelector('.m-item[data-k="' + (q.get('s') || '快捷入口') + '"]'));
moveBar(cur, false);
addEventListener('resize', () => moveBar(cur, false));
const keys = ['快捷入口','概览','启动配置','内存设置','Mod 管理','资源包','存档','工具与维护','导出整合包'];
addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) {
    const el = document.querySelector('.m-item[data-k="' + keys[n-1] + '"]');
    if (el) selectSection(el);
  }
});
</script>
