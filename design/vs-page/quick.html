<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>版本设置 · 快捷入口</title><link rel="stylesheet" href="kit.css">
<style>
.li{width:1em;height:1em;flex:0 0 auto;display:block}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)}
.back{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg2)}
.back:hover{background:#11151c}
.vt{font-size:14px;font-weight:600}.vs{font-size:10.5px;color:var(--fg3);margin-top:1px}
.main{padding:18px 20px;height:calc(100% - 52px);overflow:auto}
.grp{margin-bottom:14px}
.grp-t{font-size:10.5px;color:var(--fg3);letter-spacing:.1em;margin:0 0 8px 2px}
.flow{display:flex;flex-wrap:wrap;gap:8px}
.qbtn{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;min-width:130px;
  border:1px solid var(--line2);border-radius:8px;background:transparent;color:var(--fg2);font-size:12px;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease)}
.qbtn .li{width:14px;height:14px;color:var(--fg3);transition:color var(--dur) var(--ease)}
.qbtn:hover{border-color:#39414f;background:#101419;color:var(--fg)}
.qbtn:hover .li{color:var(--fg2)}
.qbtn:active{transform:scale(.985)}
.qbtn.danger{color:#e9b1ab}.qbtn.danger .li{color:#b5736c}
.qbtn.danger:hover{border-color:#5a2a2a;background:#140d0e;color:#fca5a5}
.qbtn.danger:hover .li{color:#fca5a5}
/* 变体 2：瓦片 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px}
.tile{height:76px;border:1px solid var(--line2);border-radius:10px;background:#0c0e13;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;color:var(--fg2);font-size:11.5px;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease)}
.tile .li{width:17px;height:17px;color:var(--fg3);transition:color var(--dur) var(--ease)}
.tile:hover{background:#11151b;border-color:#39414f;color:var(--fg)}
.tile:hover .li{color:#9db8e8}
/* 变体 3：双列列表 */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0 32px;max-width:900px}
.lrow{height:40px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #0f1217;color:var(--fg2);font-size:12px}
.lrow .li{width:14px;height:14px;color:var(--fg3)}
.lrow .hint{margin-left:auto;font-size:10px;color:#414854}
.lrow:hover{color:var(--fg)}.lrow:hover .hint{color:var(--fg3)}
.lgrp{font-size:10.5px;color:var(--fg3);letter-spacing:.1em;margin:0 0 2px}
/* 变体 4：工具条 */
.bar{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line2);border-radius:10px;background:#0b0e13}
.chip{height:30px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;border-radius:7px;color:var(--fg2);font-size:11.5px;white-space:nowrap;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.chip .li{width:13px;height:13px;color:var(--fg3)}
.chip:hover{background:#151a21;color:var(--fg)}
.chip:hover .li{color:var(--fg2)}
.sep{width:1px;height:16px;background:var(--line2);flex:0 0 auto;margin:0 2px}
.note{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:10.5px;color:#8a7434}
.note .li{width:13px;height:13px;color:#a98a45}
.h1{font-size:12.5px;font-weight:600;margin:0 0 12px 2px}
.v{display:none}
body[data-v="1"] .v1,body[data-v="2"] .v2,body[data-v="3"] .v3,body[data-v="4"] .v4{display:block}
.mk{position:fixed;right:6px;top:60px;width:34px;display:flex;flex-direction:column;gap:4px;padding:8px;
  background:rgba(11,14,20,.92);border:1px solid var(--line2);border-radius:10px;font-size:11px;color:var(--fg3)}
.mk b{font-size:9px;font-weight:400;text-align:center;padding-bottom:3px}
.mk button{height:26px;border-radius:6px;color:var(--fg3);font-size:11px}
.mk button.on{background:var(--accent-soft);color:#a9c8ff}
</style></head>
