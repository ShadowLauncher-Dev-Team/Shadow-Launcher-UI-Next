<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>Shadow Launcher · 启动动画设计稿</title>
<style>
:root{--bg:#08090d;--side:#0a0b0f;--line:#14171d;--line2:#262b35;--fg:#e8ebf2;--fg2:#98a1ae;--fg3:#5d6673;--accent:#3b82f6;--accentText:#a9c8ff;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050609;color:var(--fg);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 20px 40px}
header{width:100%;max-width:1120px;margin-bottom:16px}
h1{font-size:15px;font-weight:600;letter-spacing:.3px}
h1 span{color:var(--fg3);font-weight:400;margin-left:10px;font-size:12px}
p.desc{color:var(--fg3);font-size:12px;margin-top:6px;line-height:1.7;max-width:860px}
.wrap{width:100%;max-width:1120px;display:flex;gap:24px;align-items:flex-start}
.stagebox{flex:0 1 auto;min-width:0}
.scaled{position:relative;overflow:hidden;border-radius:12px}
.stage{position:relative;width:1100px;height:720px;transform-origin:top left;background:var(--bg);overflow:hidden;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 0 1px #1a1d24}
.wall{position:absolute;inset:0;background:url(../ui/stage-aurora.jpg) center/cover no-repeat,#0d1420;opacity:0}
.veil{position:absolute;inset:0;background:var(--bg);opacity:1}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,13,.90) 0%,rgba(8,9,13,.52) 26%,rgba(8,9,13,.10) 50%,rgba(8,9,13,0) 72%);opacity:0}
.side{position:absolute;left:0;top:0;bottom:0;width:208px;background:var(--side);opacity:0}
.sideEdge{position:absolute;left:208px;top:0;bottom:0;width:1px;background:var(--line);opacity:0}
.sideTop{position:absolute;left:24px;top:24px;opacity:0}
.brand{font-size:14px;font-weight:600;letter-spacing:2.2px;color:var(--fg)}
.wmIntro{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.nav{position:absolute;left:0;top:96px;width:100%;padding:0 12px}
.navrow{position:relative;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:8px;color:var(--fg2);font-size:13px;opacity:0;transform:translateY(4px)}
.navrow.on{background:#12151c;color:var(--fg)}
.navrow.on:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--accent)}
.dot{width:14px;height:14px;border:1px solid #3a4150;border-radius:3px;flex:0 0 auto}
.sideBottom{position:absolute;left:24px;bottom:22px;font-size:11px;color:var(--fg3);opacity:0}
.content{position:absolute;left:208px;right:0;top:0;bottom:0;opacity:0}
.lastplay{position:absolute;left:56px;top:300px;font-size:11px;color:var(--fg3)}
.ver{position:absolute;left:56px;top:322px;font-size:76px;font-weight:700;letter-spacing:-2px;line-height:1}
.ver small{font-size:22px;font-weight:600;color:var(--fg2);letter-spacing:0;margin-left:6px}
.btns{position:absolute;left:56px;top:470px;display:flex;gap:12px}
.btn{height:44px;padding:0 22px;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:#12151c;border:1px solid var(--line2);color:var(--fg)}
.btn.pri{background:linear-gradient(180deg,#4b8cf7,#2563eb);border-color:#3b82f6;color:#fff;box-shadow:0 6px 18px rgba(59,130,246,.28)}
.tria{width:0;height:0;border-left:10px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:2px}
.wmIntro{position:absolute;left:24px;top:24px;font-size:44px;font-weight:600;letter-spacing:3.2px;color:var(--fg);transform-origin:left top;white-space:nowrap;opacity:0}
.hair{position:absolute;height:1px;background:var(--accent);opacity:0;transform-origin:left center}
.vline{position:absolute;width:1px;background:var(--accent);opacity:0;transform-origin:top center}
.col{position:absolute;left:64px;top:300px;font-family:"Cascadia Mono","Consolas",monospace;font-size:12px;color:var(--fg2)}
.colline{opacity:0;margin-bottom:10px;white-space:nowrap}
.colline b{color:var(--fg);font-weight:600}
.colline i{font-style:normal;color:var(--fg3)}
.marks{position:absolute;left:0;top:0;right:0;height:0}
.mark{position:absolute;top:0;width:1px;height:720px;background:rgba(59,130,246,.14)}
.mark span{position:absolute;top:8px;left:6px;font-size:10px;color:var(--accentText);white-space:nowrap;background:rgba(8,9,13,.75);padding:1px 4px;border-radius:3px}
.hud{position:absolute;right:14px;top:12px;font-size:11px;color:var(--fg3);font-family:"Cascadia Mono","Consolas",monospace}
.panel{width:264px;flex:0 0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:#0b0d12;border:1px solid #171a21;border-radius:10px;padding:13px}
.card h2{font-size:11px;font-weight:600;color:var(--fg3);letter-spacing:.6px;margin-bottom:9px}
.seg{display:flex;flex-direction:column;gap:6px}
button{font-family:inherit;font-size:12px;color:var(--fg);background:#12151c;border:1px solid #232833;border-radius:7px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
button:hover{background:#171b24;border-color:#2e3542}
button.act{background:#132340;border-color:#3b82f6;color:#dce8ff}
button em{font-style:normal;color:var(--fg3);font-size:11px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1 1 auto;justify-content:center;text-align:center}
input[type=range]{width:100%;accent-color:#3b82f6}
.meta{font-size:11px;color:var(--fg3);line-height:1.75}
.meta b{color:var(--fg2);font-weight:600}
.timeline{width:100%;max-width:1120px;margin-top:14px;display:flex;gap:14px;align-items:center}
</style></head><body>
<header><h1>启动动画设计稿<span>Shadow Launcher v1.0.4 · 三版对照</span></h1>
<p class="desc">舞台按真实窗口 1100×720、侧栏 208px、字标 SHADOW 14px / 字距 2.2 复刻。右栏可切方案、拖时间轴、逐帧看。约束：全程单元素、结束由「首帧渲染完成」决定（演示以 900ms 收尾）、不出现加载条。</p></header>
<div class="wrap"><div class="stagebox"><div class="scaled" id="scaled"><div class="stage" id="stage">
  <div class="wall" id="wall"></div>
  <div class="scrim" id="scrim"></div>
  <div class="veil" id="veil"></div>
  <div class="content" id="content"><div class="lastplay">上次游玩 · 今天 13:45</div><div class="ver">26.3<small>1.21.3</small></div>
    <div class="btns"><div class="btn pri"><div class="tria"></div>启动游戏</div><div class="btn">版本</div><div class="btn">设置</div></div></div>
  <div class="side" id="side"></div><div class="sideEdge" id="sideEdge"></div>
  <div class="nav" id="nav"><div class="navrow on"><div class="dot"></div>启动</div><div class="navrow"><div class="dot"></div>下载</div><div class="navrow"><div class="dot"></div>联机</div><div class="navrow"><div class="dot"></div>设置</div></div>
  <div class="sideBottom" id="sideBottom">v1.0.4</div>
  <div class="wmIntro" id="wm">SHADOW</div>
  <div class="hair" id="hairL"></div><div class="hair" id="hairR"></div>
  <div class="vline" id="vline"></div>
  <div class="col" id="col"><div class="colline" id="c0">账号 <b>3</b> <i>2ms</i></div><div class="colline" id="c1">版本 <b>923</b> <i>11ms</i></div><div class="colline" id="c2">图标 <b>3</b> <i>128ms</i></div><div class="colline" id="c3">首帧 <b>就绪</b> <i>1812ms</i></div></div>
  <div class="marks" id="marks"></div>
  <div class="hud" id="hud">t = 0 ms</div>
</div></div><div class="timeline"><input type="range" id="scrub" min="0" max="900" value="0"><span id="tl" class="meta" style="white-space:nowrap">0 / 900 ms</span></div></div>
<div class="panel">
  <div class="card"><h2>方案</h2><div class="seg">
    <button id="btnA" class="act" onclick="setConcept(&quot;A&quot;)">影子落定<em>推荐</em></button>
    <button id="btnB" onclick="setConcept(&quot;B&quot;)">一条线裂成界面<em>备选</em></button>
    <button id="btnC" onclick="setConcept(&quot;C&quot;)">真进度<em>实验</em></button>
  </div></div>
  <div class="card"><h2>播放</h2><div class="row"><button id="btnPlay" onclick="togglePlay()">暂停</button><button onclick="replay()">重播</button></div>
    <div class="row" style="margin-top:8px"><button onclick="frame(0)">0</button><button onclick="frame(260)">260</button><button onclick="frame(520)">520</button><button onclick="frame(760)">760</button><button onclick="frame(900)">900</button></div>
    <div class="row" style="margin-top:8px"><button id="btnMark" onclick="toggleMarks()">显示标注</button></div></div>
  <div class="card"><h2>这一版在做什么</h2><div class="meta" id="spec"></div></div>
</div></div>
<script>
var ST=document.getElementById("stage"),WM=document.getElementById("wm");
var WALL=document.getElementById("wall"),VEIL=document.getElementById("veil"),SCRIM=document.getElementById("scrim");
var SIDE=document.getElementById("side"),SEDGE=document.getElementById("sideEdge"),STOP={style:{}};
var NAV=[].slice.call(document.querySelectorAll(".navrow")),SBOT=document.getElementById("sideBottom");
var CONTENT=document.getElementById("content"),HUD=document.getElementById("hud");
var HAIRL=document.getElementById("hairL"),HAIRR=document.getElementById("hairR"),VLINE=document.getElementById("vline");
var COL=[].slice.call(document.querySelectorAll(".colline")),COLL=document.getElementById("col");
var MARKS=document.getElementById("marks"),SCRUB=document.getElementById("scrub"),TL=document.getElementById("tl");
var SW=1100,SH=720,SIDEW=208,WM_L=24,WM_T=24,WM_FS=14;
var concept="A",t=0,playing=true,last=0,marksOn=false,WM_INFO={w:70,h:18},SCALE=1;
var SPECS={
  A:"<b>影子落定</b>　0-260ms 字标从 12px 模糊收实；260-520ms 缩小并左移，落进侧栏原位；520-760ms 壁纸淡入、侧栏与菜单错峰出现。<br><br>要点：舞台上只有一个字标节点，它最后就停在侧栏里 —— 交接是同一个元素，不是两次淡入淡出。",
  B:"<b>一条线裂成界面</b>　0-340ms 一条 1px 发丝线从中心向两端生长；340-560ms 左半变成侧栏右边线（竖线同时长满高度），右半抬到顶部变成内容区上边界；560-900ms 壁纸与界面淡入。<br><br>要点：动画的终点几何就是界面本身的几何。",
  C:"<b>真进度</b>　40-260ms 四行真实数字逐条落下（账号 3 / 版本 923 / 图标 3 / 首帧就绪，取自真实启动日志）；430-680ms 整列左滑退场；680-900ms 界面出现。<br><br>要点：不造假进度条，每一条都是启动时真的发生的事。"
};
function clamp01(x){return x<0?0:(x>1?1:x)}
function easeOutCubic(x){return 1-Math.pow(1-x,3)}
function seg(a,b){return clamp01((t-a)/(b-a))}
function measure(){
  WM.style.transform="none";WM.style.opacity="1";WM.style.fontSize=WM_FS+"px";
  WM.style.letterSpacing="2.2px";WM.style.filter="none";
  var r=WM.getBoundingClientRect();
  WM_INFO={w:r.width/SCALE,h:r.height/SCALE};
  WM.style.opacity="0";
}
function layout(){
  var wrapW=document.querySelector(".wrap").clientWidth;
  var avail=wrapW-264-24;
  SCALE=Math.min(1,Math.max(0.35,avail/SW));
  var sc=document.getElementById("scaled");
  sc.style.width=(SW*SCALE)+"px";sc.style.height=(SH*SCALE)+"px";
  ST.style.transform="scale("+SCALE+")";
  measure();render();
}
function hideAll(){
  WM.style.opacity="0";WM.style.filter="none";WM.style.transform="none";
  WM.style.fontSize=WM_FS+"px";WM.style.letterSpacing="2.2px";
  WALL.style.opacity="0";SCRIM.style.opacity="0";VEIL.style.opacity="1";
  SIDE.style.opacity="0";SEDGE.style.opacity="0";STOP.style.opacity="0";SBOT.style.opacity="0";
  NAV.forEach(function(n){n.style.opacity="0";n.style.transform="translateY(4px)"});
  CONTENT.style.opacity="0";
  HAIRL.style.opacity="0";HAIRR.style.opacity="0";VLINE.style.opacity="0";
  COL.forEach(function(c){c.style.opacity="0";c.style.transform="translateY(6px)"});
  COLL.style.opacity="1";COLL.style.transform="none";
}
function showChrome(p){
  VEIL.style.opacity=String(1-p);
  WALL.style.opacity=String(clamp01(p*1.15));
  SCRIM.style.opacity=String(clamp01(p*1.15));
  SIDE.style.opacity=String(clamp01(p*1.5));
  SEDGE.style.opacity=String(clamp01(p*1.5));
  // 侧栏字标不单独出现：wmIntro 缩到 14px 后就落在这里，等于同一个节点
  STOP.style.opacity="0";
  SBOT.style.opacity=String(clamp01((p-0.55)/0.45));
  CONTENT.style.opacity=String(clamp01((p-0.22)/0.78));
  NAV.forEach(function(n,i){
    var q=clamp01((p-i*0.13)/0.55);
    n.style.opacity=String(q);n.style.transform="translateY("+(4*(1-q))+"px)";
  });
}
function renderA(){
  var p1=seg(0,260),p2=seg(260,520),p3=seg(520,760);
  var w=WM_INFO.w,h=WM_INFO.h;
  var tx=(SW/2)-(WM_L+w/2),ty=(SH/2)-(WM_T+h/2);
  var q=easeOutCubic(p2);
  var s=1+(WM_FS/44-1)*q;
  WM.style.fontSize="44px";
  WM.style.letterSpacing=(3.2+(2.2-3.2)*q)+"px";
  var blur=12*(1-easeOutCubic(p1));
  WM.style.filter=blur>0.08?("blur("+blur.toFixed(2)+"px)"):"none";
  WM.style.opacity=String(clamp01(p1*1.3));
  WM.style.transform="translate("+(tx*(1-q))+"px,"+(ty*(1-q))+"px) scale("+s+")";
  showChrome(p3);
}
function renderB(){
  var p1=seg(0,340),p2=seg(340,560),p3=seg(560,900);
  var half=(SW/2)*easeOutCubic(p1);
  HAIRL.style.opacity="0.9";HAIRR.style.opacity="0.9";
  HAIRL.style.top=(SH/2)+"px";HAIRL.style.left=(SW/2-half)+"px";HAIRL.style.width=half+"px";
  HAIRR.style.top=(SH/2)+"px";HAIRR.style.left=(SW/2)+"px";HAIRR.style.width=half+"px";
  var r=easeOutCubic(p2);
  HAIRL.style.left=SIDEW+"px";HAIRL.style.width=(half*(1-r)).toFixed(1)+"px";
  HAIRL.style.opacity=String(0.9*(1-r));
  HAIRR.style.top=((SH/2)*(1-r))+"px";HAIRR.style.left=((SW/2)+(SIDEW-SW/2)*r)+"px";HAIRR.style.width=((SW/2)+((SW-SIDEW)-(SW/2))*r)+"px";
  HAIRR.style.opacity=String(0.9*(1-clamp01(p3*2)));
  VLINE.style.left=SIDEW+"px";VLINE.style.top="0px";VLINE.style.height=(SH*r)+"px";
  VLINE.style.opacity=String(clamp01(r));
  WM.style.opacity=String(clamp01((p3-0.35)/0.5));
  showChrome(p3);
}
function renderC(){
  var p1=seg(40,260),p2=seg(260,430),p3=seg(430,680),p4=seg(680,900);
  COL.forEach(function(c,i){
    var q=clamp01((p1-i*0.18)/0.5);
    c.style.opacity=String(q);c.style.transform="translateY("+(6*(1-q))+"px)";
  });
  var slide=easeOutCubic(p3);
  COLL.style.transform="translate("+(-46*slide)+"px,0)";
  COLL.style.opacity=String(1-slide*0.9);
  WM.style.opacity=String(clamp01((p4-0.25)/0.6));
  showChrome(p4);
}
function render(){
  hideAll();
  if(t>900)t=900;
  if(concept==="A")renderA();else if(concept==="B")renderB();else renderC();
  HUD.textContent="t = "+Math.round(t)+" ms";
  SCRUB.value=String(Math.round(t));
  TL.textContent=Math.round(t)+" / 900 ms";
}
function setConcept(c){
  concept=c;
  ["A","B","C"].forEach(function(k){document.getElementById("btn"+k).className=(k===c?"act":"")});
  document.getElementById("spec").innerHTML=SPECS[c];
  t=0;playing=true;document.getElementById("btnPlay").textContent="暂停";render();
}
function togglePlay(){playing=!playing;last=0;document.getElementById("btnPlay").textContent=playing?"暂停":"播放"}
function replay(){t=0;playing=true;document.getElementById("btnPlay").textContent="暂停";render()}
function frame(v){playing=false;document.getElementById("btnPlay").textContent="播放";t=v;render()}
function toggleMarks(){
  marksOn=!marksOn;
  MARKS.innerHTML="";
  document.getElementById("btnMark").className=marksOn?"act":"";
  if(!marksOn)return;
  var M=[[0,"0 黑场"],[260,"260 收实"],[520,"520 落位"],[760,"760 壁纸"],[900,"900 首帧"]];
  M.forEach(function(m){
    var d=document.createElement("div");
    d.className="mark";d.style.left=(m[0]/900*100)+"%";
    d.innerHTML="<span>"+m[1]+"</span>";
    MARKS.appendChild(d);
  });
}
SCRUB.addEventListener("input",function(){playing=false;document.getElementById("btnPlay").textContent="播放";t=Number(SCRUB.value);render()});
function tick(ts){
  if(!last)last=ts;
  var dt=ts-last;last=ts;
  if(playing){t+=dt;if(t>=900){t=900;playing=false;document.getElementById("btnPlay").textContent="播放"}render()}
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
window.addEventListener("load",function(){
  layout();
  var q=new URLSearchParams(location.search);
  setConcept(q.get("c")||"A");
  if(q.get("t"))frame(Number(q.get("t")));
  requestAnimationFrame(tick);
});
</script></body></html>
